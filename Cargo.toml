[package]
name = "nomount"
version = "1.3.117"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "= 4.5.57", features = ["derive"] }
anyhow = "= 1.0.101"
libc = "= 0.2.180"

[dev-dependencies]
tempfile = "3"

[profile.dev]
strip = false
debug = 2
opt-level = 0

[profile.release]
lto = true
strip = true
opt-level = "s"
codegen-units = 1
