name: NoMount hookless - compile-test matrix

# Renamed from hookless-compile-matrix.yml, and the rename IS the fix -- the same fault
# lkm-build.yml had. The push and pull_request triggers below have been in place since at
# least 2026-09-30 (d5ca693), seven pushes to main changed files under hookless/** since
# then -- f057a61, 6f6d620, 4a188fa, 4644599, 86b9a61, dbf1066, 8dee149 -- and this workflow
# produced ZERO runs, while tag.yml, same trigger shape, fired on those same pushes. So the
# engine this repo ships was never compile-tested by the gate written to test it, and
# hookless/README.md's claim that it runs "on every push" was false for the whole period.
# A new path forces GitHub to register a new workflow record, which is the only lever
# outside the UI; it worked for lkm-build.yml on 452d259.
#
# src/mount.rs include_str!()s this file by path and asserts all ten `ver:` entries are
# present, so a rename breaks the build unless that test is updated with it. That test
# exists because c223943 once deleted this workflow outright and nothing compile-tested
# the shipped engine until someone noticed.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated kernel versions to compile (empty = all ten)'
        type: string
        required: false
        default: ''
  push:
    branches: [prerelease, main]
    paths:
      - 'hookless/**'
      - '.github/workflows/hookless-matrix.yml'
  pull_request:
    branches: [prerelease, main]
    paths:
      - 'hookless/**'
      - '.github/workflows/hookless-matrix.yml'
  workflow_call:
    inputs:
      only:
        description: 'Comma-separated kernel versions to compile (empty = all ten)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: hookless-matrix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compile:
    name: ${{ matrix.ver }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - ver: '4.9'
            krepo: 'https://android.googlesource.com/kernel/common'
            kref: 'deprecated/android-4.9-q'
            tc: gcc
          - ver: '4.14'
            krepo: 'https://android.googlesource.com/kernel/common'
            kref: 'deprecated/android-4.14-stable'
            tc: gcc
          - ver: '4.19'
            krepo: 'https://android.googlesource.com/kernel/common'
            kref: 'deprecated/android-4.19-stable'
            tc: gcc
          - ver: '5.4'
            krepo: 'https://android.googlesource.com/kernel/common'
            kref: 'android11-5.4'
            tc: clang
          - ver: '5.10'
            krepo: 'https://android.googlesource.com/kernel/common'
            kref: 'android12-5.10'
            tc: clang
          - ver: '5.15'
            krepo: 'https://android.googlesource.com/kernel/common'
            kref: 'android13-5.15'
            tc: clang
          - ver: '6.1'
            krepo: 'https://android.googlesource.com/kernel/common'
            kref: 'android14-6.1'
            tc: clang
          - ver: '6.6'
            krepo: 'https://android.googlesource.com/kernel/common'
            kref: 'android15-6.6'
            tc: clang
          - ver: '6.12'
            krepo: 'https://android.googlesource.com/kernel/common'
            kref: 'android16-6.12'
            tc: clang
          - ver: '6.18'
            krepo: 'https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git'
            kref: 'linux-6.18.y'
            tc: clang
    env:
      CCACHE_MAXSIZE: '2G'
      CCACHE_DIR: /home/runner/.ccache
    steps:
      - name: Select
        id: sel
        env:
          ONLY: ${{ inputs.only }}
          VER: ${{ matrix.ver }}
        run: |
          if [ -z "$ONLY" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          for v in ${ONLY//,/ }; do
            if [ "$v" = "$VER" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "run=0" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipped $VER (not in 'only' filter)"

      - name: Checkout hookless (src + patches)
        if: steps.sel.outputs.run == '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo

      - name: Install build deps
        if: steps.sel.outputs.run == '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio kmod \
            build-essential git ca-certificates rsync ccache sparse \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          if [ "${{ matrix.tc }}" = "clang" ]; then
            sudo apt-get install -y --no-install-recommends clang lld llvm
            clang --version | head -1
          else
            aarch64-linux-gnu-gcc --version | head -1
          fi
          for n in clang clang++ gcc g++ cc c++ aarch64-linux-gnu-gcc aarch64-linux-gnu-g++; do
            sudo ln -sf /usr/bin/ccache "/usr/lib/ccache/$n"
          done
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

      - name: Restore ccache
        if: steps.sel.outputs.run == '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.ver }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.ver }}-

      # The key was version + branch NAME + a hand-bumped -v1, so a cached tree never expired
      # when the branch moved and this gate would assert hunk placement against whatever was
      # cached. lkm-build.yml had the same bug and gated 6.12 against a 26-day-old clone.
      # ls-remote failing is fatal: an answer we could not get must not read as "the cached
      # tree is current", and the clone below needs this remote anyway.
      - name: Resolve the kernel ref to a commit
        id: kref
        if: steps.sel.outputs.run == '1'
        run: |
          set -euo pipefail
          SHA=$(git ls-remote "${{ matrix.krepo }}" "refs/heads/${{ matrix.kref }}" | cut -f1)
          [ -n "$SHA" ] || {
            echo "::error::no refs/heads/${{ matrix.kref }} at ${{ matrix.krepo }} - renamed, or"
            echo "::error::the remote is unreachable. Not falling back to the branch-name key."
            exit 1
          }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.kref }} is at $SHA"

      - name: Restore kernel clone
        if: steps.sel.outputs.run == '1'
        id: kcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ksrc
          key: ksrc-${{ matrix.ver }}-${{ matrix.kref }}-v2-${{ steps.kref.outputs.sha }}

      - name: Clone kernel source (${{ matrix.kref }}) on cache miss
        if: steps.sel.outputs.run == '1' && steps.kcache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --depth 1 -b "${{ matrix.kref }}" "${{ matrix.krepo }}" ksrc
          echo "Kernel: $(head -3 ksrc/Makefile | tr '\n' ' ')"
          echo "HEAD: $(git -C ksrc rev-parse HEAD) (keyed on ${{ steps.kref.outputs.sha }})"

      - name: Save kernel clone (pristine) on cache miss
        if: steps.sel.outputs.run == '1' && steps.kcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ksrc
          key: ksrc-${{ matrix.ver }}-${{ matrix.kref }}-v2-${{ steps.kref.outputs.sha }}

      # Can the task_mmu.c hunk be made to land in show_smap()?
      #
      # hookless/README.md names this as the hazard of applying our patch AFTER SUSFS,
      # which also patches task_mmu.c: at fuzz the hunk can match show_smap(), "whose
      # dev/ino lines read the same", and an injected file then reports its real dev/ino
      # in /proc/<pid>/maps while smaps reports the stock pair -- readable by any app.
      # The step below already asserts placement, but only against a PRISTINE tree, where
      # the right site is the best match anyway, so that assertion has never faced a tree
      # where the wrong site wins. This builds one.
      #
      # It runs on a copy and does not touch ksrc. No SUSFS checkout: coupling this gate
      # to a tree we do not control would redden it for reasons that are not about us, and
      # what is being tested is our patch's own anchoring.
      - name: Can the task_mmu hunk be misplaced?
        if: steps.sel.outputs.run == '1'
        run: |
          set -eu
          W="$RUNNER_TEMP/misplace"; rm -rf "$W"; mkdir -p "$W/fs/proc"
          cp ksrc/fs/proc/task_mmu.c "$W/fs/proc/task_mmu.c"
          P="$GITHUB_WORKSPACE/repo/hookless/patches/nomount_kernel_integration.patch"
          # The task_mmu hunk alone. The guard on the exit keeps the opening line, which
          # is itself a `diff --git`, from ending the slice immediately.
          awk '/^diff --git a\/fs\/proc\/task_mmu\.c/{f=1}
               f && /^diff --git/ && !/task_mmu\.c/{exit} f' "$P" > "$W/tm.patch"
          [ -s "$W/tm.patch" ] || { echo "FATAL: no task_mmu.c hunk in the patch"; exit 1; }

          cd "$W"
          rivals=$(grep -c 'ino = inode->i_ino;' fs/proc/task_mmu.c || true)
          line=$(awk '/^(static )?[a-zA-Z_].*\(/{fn=$0}
                      /ino = inode->i_ino;/{ if (fn ~ /show_map_vma/) seen=1 }
                      seen && /pgoff = /{ print NR; exit }' fs/proc/task_mmu.c)
          if [ "${rivals:-0}" -lt 2 ] || [ -z "$line" ]; then
            # Inert rather than passing quietly: say which kernels it could not set up.
            echo "::warning::${{ matrix.ver }}: cannot build a misplacement case here"
            echo "::warning::(rival dev/ino sites=$rivals, show_map_vma pgoff anchor=${line:-none})."
            echo "misplace ${{ matrix.ver }}: SKIPPED"
            echo "- \`${{ matrix.ver }}\` misplacement probe **skipped** (no rival site)" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Break the anchor inside show_map_vma so the show_smap copy is the better
          # fuzzy match -- the state SUSFS-then-us would leave the file in.
          sed -i "${line}s|.*|\t\tpgoff = 0; /* perturbed by the misplacement probe */|" \
            fs/proc/task_mmu.c
          if patch -p1 --forward --fuzz=3 < tm.patch > "$W/out" 2>&1; then
            got=$(awk '/^(static )?[a-zA-Z_].*\(/{last=$0}
                       /vfs_map_meta_override\(inode/{print last; found=1; exit}
                       END{ if(!found) exit 1 }' fs/proc/task_mmu.c || echo "<nowhere>")
            case "$got" in
            *show_map_vma*)
              echo "misplace ${{ matrix.ver }}: OK - still landed in show_map_vma" ;;
            *)
              # REPORTED, not fatal, and deliberately for one round.
              #
              # Run against fixtures before this landed, the probe showed the hazard is
              # reachable at --fuzz=3 even when the rival site LACKS the pgoff anchor:
              # fuzz 3 may drop three context lines, which is the whole anchor, so two
              # matching lines are enough. The only reason it does not happen today is
              # that a pristine tree gives show_map_vma a perfect match and patch takes
              # the first best one.
              #
              # So failing here would redden the matrix for a condition the shipped order
              # never reaches, while the real fix is structural: if the fuzz0 measurement
              # above comes back YES on all ten, drop the --fuzz=3 fallback entirely and
              # apply the way the builders do. Then this becomes unreachable and this arm
              # becomes a FATAL. One matrix run decides it.
              echo "::warning::${{ matrix.ver }}: with show_map_vma's anchor broken, the hunk"
              echo "::warning::landed in $got - the SUSFS-after-us failure hookless/README.md"
              echo "::warning::warns about, reachable at --fuzz=3. Not a failure today: the"
              echo "::warning::shipped order applies to a pristine tree at --fuzz=0."
              echo "misplace ${{ matrix.ver }}: REACHABLE at --fuzz=3 (landed in $got)"
              echo "- \`${{ matrix.ver }}\` misplacement **reachable at --fuzz=3** (\`$got\`)" \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
            esac
          else
            echo "misplace ${{ matrix.ver }}: OK - refused to apply rather than guessing"
          fi
          echo "- \`${{ matrix.ver }}\` misplacement probe **held**" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply hookless patch + drop in source
        if: steps.sel.outputs.run == '1'
        run: |
          set -e
          cd ksrc
          P="$GITHUB_WORKSPACE/repo/hookless/patches/nomount_kernel_integration.patch"
          # --fuzz=0 FIRST, because that is how all three kernel builders apply this patch
          # (hookless/README.md). Only the 6.12 link job below ever tried it; the matrix
          # went straight to --fuzz=3, so a kernel that needs fuzz passed here while the
          # builders' own apply would have failed, and nothing said so. Measured per
          # kernel now, and reported either way.
          #
          # Not fatal when fuzz is needed: AOSP common is not the vendor tree the builders
          # patch, so needing fuzz here does not prove their apply fails. Measure first.
          #
          # The old `git apply --check` probe is gone - it is stricter than
          # `patch --fuzz=0` about whitespace, so it printed "needs fuzz" for 6.12 this
          # morning and the link job then applied that same patch at --fuzz=0 without one.
          if patch -p1 --forward --fuzz=0 --dry-run < "$P" >/dev/null 2>&1; then
            patch -p1 --forward --fuzz=0 < "$P"
            echo "fuzz0 ${{ matrix.ver }}: YES - applies the way the builders apply it"
            echo "- \`${{ matrix.ver }}\` applies at --fuzz=0" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::${{ matrix.ver }} does NOT take the integration patch at"
            echo "::warning::--fuzz=0, which is how hookless/README.md says all three kernel"
            echo "::warning::builders apply it. Falling back to --fuzz=3; the hunk-placement"
            echo "::warning::assertions below are then the only thing standing between a"
            echo "::warning::fuzzy match and vfs_map_meta_override() landing in show_smap()."
            echo "fuzz0 ${{ matrix.ver }}: NO"
            echo "- \`${{ matrix.ver }}\` needs **fuzz** (builders apply at --fuzz=0)" \
              >> "$GITHUB_STEP_SUMMARY"
            if ! patch -p1 --forward --fuzz=3 < "$P"; then
              echo "FATAL: the integration patch does not apply to ${{ matrix.ver }}, even at --fuzz=3"; exit 1; fi
          fi
          cp "$GITHUB_WORKSPACE/repo/hookless/src/nomount.c" fs/nomount.c
          cp "$GITHUB_WORKSPACE/repo/hookless/src/nomount.h" fs/nomount.h
          grep -n 'CONFIG_NOMOUNT' fs/Makefile fs/Kconfig || true

      - name: Configure + compile fs/nomount.o
        id: build
        if: steps.sel.outputs.run == '1'
        run: |
          set -o pipefail
          cd ksrc
          if [ "${{ matrix.tc }}" = "clang" ]; then
            MAKEOPTS="ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS=-Wno-error"
          else
            MAKEOPTS="ARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS=-Wno-error"
          fi
          echo "MAKEOPTS=$MAKEOPTS" >> "$GITHUB_ENV"
          echo "== assert fs/Makefile + fs/Kconfig hunks applied =="
          grep -q 'obj-$(CONFIG_NOMOUNT) += nomount.o' fs/Makefile || {
            echo "FATAL: fs/Makefile hunk did not apply for ${{ matrix.ver }} -- nomount.o would never be linked"; exit 1; }
          grep -qE '^config NOMOUNT' fs/Kconfig || {
            echo "FATAL: fs/Kconfig hunk did not apply for ${{ matrix.ver }}"; exit 1; }

          echo "== defconfig =="
          make $MAKEOPTS defconfig 2>&1 | tail -5
          ./scripts/config --file out/.config -e NOMOUNT -e OVERLAY_FS
          make $MAKEOPTS olddefconfig 2>&1 | tail -5
          grep -q '^CONFIG_NOMOUNT=y' out/.config || {
            echo "FATAL: CONFIG_NOMOUNT did not stick in .config for ${{ matrix.ver }}"; exit 1; }
          # Every CONFIG_ symbol nomount.[ch] gates on POSITIVELY must be SET in the
          # config we compile, or that code has zero coverage behind a green check.
          # Derive the list from the source so a new gate cannot be added without
          # coverage. Symbols gated negatively (#ifndef, #if !defined) want the
          # opposite, so they are reported rather than asserted.
          # The whole conditional line is matched, not a CONFIG_-anchored prefix:
          # a bracket expression like [^\n] excludes the letter n and so can never
          # cross "defined" or "ndef". scripts/gate-sweep.sh pins this.
          # Every grep here may legitimately match nothing, and this step runs under
          # `bash -e` with `set -o pipefail`, so each needs `|| true` or a clean
          # engine fails the leg before it compiles anything.
          cond=$(grep -ohE '^[[:space:]]*#[[:space:]]*(if|ifdef|ifndef|elif)([^A-Za-z0-9_].*)?$' \
                 fs/nomount.c fs/nomount.h || true)
          ie=$(grep -ohE 'IS_ENABLED\([[:space:]]*CONFIG_[A-Z0-9_]+' fs/nomount.c fs/nomount.h || true)
          all=$(printf '%s\n%s\n' "$cond" "$ie" | grep -oE 'CONFIG_[A-Z0-9_]+' | sort -u || true)
          # `!IS_ENABLED(CONFIG_X)` is a NEGATIVE gate, but it is also matched by the `ie`
          # grep above, so without it here the symbol landed in the positive set and this
          # step demanded CONFIG_X=y -- the exact opposite of what the code needs, failing
          # every leg. Keep in step with extract_positive/extract_negative in
          # scripts/gate-sweep.sh, whose fixture now covers this form.
          neg=$(printf '%s\n' "$cond" | grep -E '(ifndef|![[:space:]]*(defined|IS_ENABLED))' \
                | grep -oE 'CONFIG_[A-Z0-9_]+' | sort -u || true)
          if [ -n "$neg" ]; then
            gates=$(comm -23 <(printf '%s\n' "$all") <(printf '%s\n' "$neg"))
            echo "::notice::${{ matrix.ver }} negative-sense config gates (not asserted): $(echo $neg)"
          else
            gates=$all
          fi
          echo "engine config gates: ${gates:-none}"
          for g in $gates; do
            grep -q "^$g=y" out/.config || {
              echo "FATAL: $g is gated in nomount.[ch] but not set for ${{ matrix.ver }} -- that code compiles nowhere"
              exit 1; }
          done
          echo "== prepare =="
          make $MAKEOPTS prepare 2>&1 | tail -20
          echo "== compile fs/nomount.o =="
          make $MAKEOPTS fs/nomount.o 2>&1 | tee /tmp/nm_build.log
          ls -l out/fs/nomount.o && echo "COMPILE_OK ${{ matrix.ver }}"
          echo "== assert task_mmu.c hook present =="
          grep -q 'vfs_map_meta_override' fs/proc/task_mmu.c || {
            echo "FATAL: integration patch did not apply its task_mmu.c hunk for ${{ matrix.ver }}"; exit 1; }
          awk '/^(static )?[a-zA-Z_].*\(/{last=$0} /vfs_map_meta_override\(inode/{print last; found=1; exit}
               END{ if(!found) exit 1 }' fs/proc/task_mmu.c | grep -q 'show_map_vma' || {
            echo "FATAL: task_mmu.c hunk applied OUTSIDE show_map_vma for ${{ matrix.ver }} (fuzzy misplacement)"; exit 1; }
          echo "== assert xattr.c hook present =="
          grep -q 'nm_inode_hidden_from_caller' fs/xattr.c || {
            echo "FATAL: integration patch did not apply its fs/xattr.c hunk for ${{ matrix.ver }} -- a hidden app could still read security.selinux"; exit 1; }
          awk '
            /error = security_inode_getxattr\(dentry, name\)/ { a=NR }
            /XATTR_SECURITY_PREFIX,/                          { if (a && !c) c=NR }
            /nm_inode_hidden_from_caller\(inode\)/            { if (a && !b) b=NR }
            END { exit !(a && b && c && a < b && b < c) }' fs/xattr.c || {
            echo "FATAL: the fs/xattr.c guard is not between security_inode_getxattr() and the security.* branch for ${{ matrix.ver }} -- there it never runs for security.selinux"; exit 1; }
          echo "== compile fs/xattr.o =="
          make $MAKEOPTS fs/xattr.o 2>&1 | tail -5
          ls -l out/fs/xattr.o && echo "XATTR_OK ${{ matrix.ver }}"

          echo "== compile fs/proc/task_mmu.o =="
          make $MAKEOPTS fs/proc/task_mmu.o 2>&1 | tee /tmp/tm_build.log
          ls -l out/fs/proc/task_mmu.o && echo "TASK_MMU_OK ${{ matrix.ver }}"
          aarch64-linux-gnu-nm --defined-only out/fs/nomount.o | grep -q 'vfs_map_meta_override' || {
            echo "FATAL: the maps-cloak global is missing or renamed for ${{ matrix.ver }}"; exit 1; }
          ccache -s 2>/dev/null | grep -iE 'hit|miss' || true

      - name: W=1 gate + sparse (advisory)
        if: steps.sel.outputs.run == '1' && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          cd ksrc
          echo "== W=1 =="
          rm -f out/fs/nomount.o
          if ! make $MAKEOPTS W=1 fs/nomount.o 2>&1 | tee /tmp/nm_w1.log; then
            echo "FATAL: the W=1 build of fs/nomount.o failed for ${{ matrix.ver }}"
            exit 1
          fi
          echo "== sparse C=2 (advisory) =="
          rm -f out/fs/nomount.o
          make $MAKEOPTS C=2 CHECK="sparse" fs/nomount.o 2>&1 | tee /tmp/nm_sparse.log || true
          w=$(grep 'warning:' /tmp/nm_w1.log 2>/dev/null | grep -c 'nomount\.[ch]' || true)
          s=$(grep 'warning:\|error:' /tmp/nm_sparse.log 2>/dev/null | grep -c 'nomount\.[ch]' || true)
          echo "::notice::${{ matrix.ver }} (nomount.c only) - W=1 warnings: ${w:-0}, sparse notes: ${s:-0}"
          W1_BASELINE=0
          if [ "${w:-0}" -gt "$W1_BASELINE" ]; then
            echo "== W=1 warnings in nomount.[ch] =="
            grep 'warning:' /tmp/nm_w1.log | grep 'nomount\.[ch]' || true
            echo "FATAL: ${{ matrix.ver }} has ${w} W=1 warning(s) in nomount.[ch], baseline ${W1_BASELINE}"
            exit 1
          fi

      - name: Save ccache
        if: ${{ always() && steps.sel.outputs.run == '1' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.ver }}-${{ github.run_id }}

      - name: Upload logs
        if: ${{ always() && steps.sel.outputs.run == '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: log-${{ matrix.ver }}
          path: |
            /tmp/nm_build.log
            /tmp/nm_w1.log
            /tmp/nm_sparse.log
          if-no-files-found: ignore

  # The legs above build objects and never link a kernel, so an engine that
  # compiles everywhere can still be unlinkable: its weak references to the cloak
  # patches failed every arm64 vmlinux link without them for three months while
  # this matrix stayed green. One real link, from hookless/ alone, closes that.
  link:
    name: link 6.12 (no cloak patches)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      KREF: android16-6.12
      CCACHE_MAXSIZE: '3G'
      CCACHE_DIR: /home/runner/.ccache
    steps:
      - name: Select
        id: sel
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -z "$ONLY" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          for v in ${ONLY//,/ }; do
            if [ "$v" = "6.12" ] || [ "$v" = "link" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "run=0" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipped the link job (neither 6.12 nor link is in the 'only' filter)"

      - name: Checkout hookless (src + patches)
        if: steps.sel.outputs.run == '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo

      - name: Install build deps
        if: steps.sel.outputs.run == '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libdw-dev cpio kmod python3 \
            build-essential git ca-certificates rsync ccache \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu clang lld llvm
          clang --version | head -1
          for n in clang clang++ gcc g++ cc c++; do
            sudo ln -sf /usr/bin/ccache "/usr/lib/ccache/$n"
          done
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

      - name: Restore ccache
        if: steps.sel.outputs.run == '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-link-6.12-${{ github.run_id }}
          restore-keys: |
            ccache-link-6.12-

      # Same key as the 6.12 compile job above, so this shares the tree that job saved rather
      # than cloning its own. It must therefore carry the same resolved sha, or this job
      # misses on every run.
      - name: Resolve the kernel ref to a commit
        id: kref
        if: steps.sel.outputs.run == '1'
        run: |
          set -euo pipefail
          SHA=$(git ls-remote https://android.googlesource.com/kernel/common "refs/heads/$KREF" | cut -f1)
          [ -n "$SHA" ] || { echo "::error::no refs/heads/$KREF on kernel/common"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "$KREF is at $SHA"

      - name: Restore kernel clone
        if: steps.sel.outputs.run == '1'
        id: kcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ksrc
          key: ksrc-6.12-android16-6.12-v2-${{ steps.kref.outputs.sha }}

      - name: Clone kernel source on cache miss
        if: steps.sel.outputs.run == '1' && steps.kcache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --depth 1 -b "$KREF" https://android.googlesource.com/kernel/common ksrc
          echo "HEAD: $(git -C ksrc rev-parse HEAD) (keyed on ${{ steps.kref.outputs.sha }})"

      - name: Apply hookless patch + drop in source
        if: steps.sel.outputs.run == '1'
        run: |
          set -e
          cd ksrc
          patch -p1 --forward --fuzz=0 < "$GITHUB_WORKSPACE/repo/hookless/patches/nomount_kernel_integration.patch"
          cp "$GITHUB_WORKSPACE/repo/hookless/src/nomount.c" fs/nomount.c
          cp "$GITHUB_WORKSPACE/repo/hookless/src/nomount.h" fs/nomount.h

      - name: Link vmlinux
        if: steps.sel.outputs.run == '1'
        run: |
          cd ksrc
          MAKEOPTS="ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu-"
          make $MAKEOPTS gki_defconfig 2>&1 | tail -3
          # LTO, BTF and Rust only cost time here: the failure this job exists
          # for was reproduced with all three off.
          ./scripts/config --file out/.config -e NOMOUNT \
            -d LTO_CLANG_THIN -d LTO_CLANG_FULL -e LTO_NONE \
            -d DEBUG_INFO_BTF -d RUST -d WERROR
          make $MAKEOPTS olddefconfig 2>&1 | tail -3
          grep -q '^CONFIG_NOMOUNT=y' out/.config || { echo "FATAL: CONFIG_NOMOUNT did not stick"; exit 1; }
          if ! make $MAKEOPTS -j"$(nproc)" vmlinux > /tmp/nm_link.log 2>&1; then
            grep -E 'error|undefined symbol|Unexpected' /tmp/nm_link.log | sort | uniq -c | head -40 || true
            echo "FATAL: a kernel built from hookless/ alone does not build through to a linked vmlinux"
            exit 1
          fi
          tail -3 /tmp/nm_link.log
          aarch64-linux-gnu-nm out/vmlinux | grep -q ' vfs_map_meta_override$' || {
            echo "FATAL: vmlinux linked, but without the engine in it"; exit 1; }
          echo "LINK_OK"
          ccache -s 2>/dev/null | grep -iE 'hit|miss' || true

      - name: Save ccache
        if: ${{ always() && steps.sel.outputs.run == '1' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-link-6.12-${{ github.run_id }}

      - name: Upload log
        if: ${{ always() && steps.sel.outputs.run == '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: log-link-6.12
          path: /tmp/nm_link.log
          if-no-files-found: ignore
