name: NoMount LKM — per-KMI modules

# Builds one nomount.ko per GKI KMI generation, in minutes rather than an hour.
#
# WHY THIS SUPERSEDES build-lkm-release.yml
#
# That workflow compiles a whole kernel just to obtain Module.symvers, which
# costs 40-60 minutes and produces a module tied to the exact build it was made
# against. The Android DDK containers already contain a prepared GKI tree for a
# given KMI -- headers, the real Module.symvers, and the AOSP clang that built
# it. Building against one takes minutes and yields a module valid for that KMI
# GENERATION rather than one kernel.
#
# The approach is taken from maxsteeel/nomount's own build-lkm.yml, which is the
# upstream this engine derives from and which solved this before we did.
#
# WHY THE MATRIX IS KMIs AND NOT KERNEL VERSIONS
#
# android12-5.10 and android13-5.10 are the same kernel version and different
# KMIs: Google bumps the generation when the interface breaks. A module is
# portable within a generation, not within a version number, so the generation
# is what an artifact has to be named after.
#
# VERMAGIC still has to match at load: it is UTS_RELEASE plus flags, and GKI
# keeps the git SHA out of it (that is what MODINFO_ATTR(scmversion) in the
# module loader is for), which is what makes one .ko serve a whole generation. A
# custom kernel that sets its own LOCALVERSION breaks that -- check
# `modinfo nomount.ko` against `cat /proc/version` before assuming.

on:
  push:
    branches: [LKM]
    paths:
      - 'lkm/**'
      - 'hookless/src/**'
      - '.github/workflows/build-lkm-kmi.yml'
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated KMIs (empty = all). e.g. android15-6.6"
        required: false
        default: ''
      variant_ref:
        description: "Branch holding lkm/ (this file lives on main; the code does not)"
        required: false
        default: 'LKM'
      ddk_tag:
        description: "DDK container tag suffix"
        required: false
        default: '20251104'

permissions:
  contents: read

concurrency:
  group: lkm-kmi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.kmi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.kmi }}-${{ github.event.inputs.ddk_tag || '20251104' }}
    steps:
      - name: Should this KMI run?
        id: sel
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -eu
          if [ -z "${ONLY:-}" ] || printf '%s' "$ONLY" | tr ',' '\n' | grep -qx '${{ matrix.kmi }}'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"; echo "skipped ${{ matrix.kmi }}"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.sel.outputs.run == '1'
        with:
          ref: ${{ github.event.inputs.variant_ref || 'LKM' }}

      - name: Validate the DDK environment
        if: steps.sel.outputs.run == '1'
        run: |
          set -eu
          if [ -z "${KDIR:-}" ] || [ ! -f "$KDIR/Makefile" ]; then
            echo "::error::KDIR is not usable in this container: ${KDIR:-<empty>}"; exit 1
          fi
          # Module.symvers is the point of using the DDK: it is the REAL export
          # table of a released GKI kernel, trimmed exactly as that kernel is.
          # Without it this would be no better than the defconfig build.
          test -s "$KDIR/Module.symvers" || {
            echo "::error::no Module.symvers in the DDK tree; this cannot link for real"; exit 1; }
          echo "KMI ${{ matrix.kmi }}, $(wc -l < "$KDIR/Module.symvers") exported symbols"
          clang --version | head -1

      - name: Which of the engine's symbols does this KMI actually export?
        if: steps.sel.outputs.run == '1'
        run: |
          set -eu
          # Recorded because the answer is not what an abi_gki_aarch64* grep
          # suggests. Several VFS symbols are exported into a NAMESPACE
          # (ANDROID_GKI_VFS_EXPORT_ONLY), so they are absent from those lists
          # while being perfectly available to a module that imports the
          # namespace -- which lkm/nomount_lkm.c does.
          #
          # This decides whether lkm/nm_oot_tramp.c still needs to carry a
          # kallsyms redirect for each of them, so it is measured per KMI rather
          # than assumed once.
          for s in vfs_getxattr vfs_setxattr free_inode_nonrcu netlink_rcv_skb \
                   security_inode_getsecctx security_inode_notifysecctx; do
            if awk -v s="$s" '$2 == s {found=1} END {exit !found}' "$KDIR/Module.symvers"; then
              ns=$(awk -v s="$s" '$2 == s {print $5}' "$KDIR/Module.symvers" | head -1)
              printf '  %-32s EXPORTED  ns=%s\n' "$s" "${ns:-<none>}"
            else
              printf '  %-32s not exported -- needs the kallsyms redirect\n' "$s"
            fi
          done | tee /tmp/exports-${{ matrix.kmi }}.txt
          {
            echo "#### ${{ matrix.kmi }}"
            echo '```'
            cat /tmp/exports-${{ matrix.kmi }}.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the module
        if: steps.sel.outputs.run == '1'
        run: |
          set -eu
          # No KBUILD_MODPOST_WARN. This links against a real export table, so a
          # missing symbol or an unimported namespace is a genuine failure and
          # must stop the build -- the compile gate suppresses those only
          # because its symbol table is fake.
          make -j"$(nproc)" -C "$KDIR" ARCH=arm64 CC=clang \
               M="$GITHUB_WORKSPACE/lkm" modules
          test -f lkm/nomount.ko || { echo "::error::no nomount.ko produced"; exit 1; }

      - name: Collect
        if: steps.sel.outputs.run == '1'
        run: |
          set -eu
          install -Dm644 lkm/nomount.ko "artifacts/nomount-${{ matrix.kmi }}.ko"
          # Debug info is most of the file and none of it is needed on a phone.
          llvm-strip -d "artifacts/nomount-${{ matrix.kmi }}.ko" || true
          {
            echo '```'
            ls -l "artifacts/nomount-${{ matrix.kmi }}.ko" | awk '{print $5" bytes"}'
            modinfo "artifacts/nomount-${{ matrix.kmi }}.ko" 2>/dev/null \
              | grep -E '^(vermagic|name|description|nomount_variant|import_ns)' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.sel.outputs.run == '1'
        with:
          name: nomount-${{ matrix.kmi }}
          path: artifacts/nomount-${{ matrix.kmi }}.ko
          if-no-files-found: error
