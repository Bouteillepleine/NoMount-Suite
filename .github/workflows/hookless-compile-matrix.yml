name: NoMount hookless - compile-test matrix

on:
  workflow_call:
    inputs:
      only:
        description: 'Comma-separated kernel versions to compile (empty = all ten)'
        type: string
        required: false
        default: ''

jobs:
  compile:
    name: ${{ matrix.ver }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - ver: '4.9'
            krepo: 'https://android.googlesource.com/kernel/common'
            kref: 'deprecated/android-4.9-q'
            tc: gcc
          - ver: '4.14'
            krepo: 'https://android.googlesource.com/kernel/common'
            kref: 'deprecated/android-4.14-stable'
            tc: gcc
          - ver: '4.19'
            krepo: 'https://android.googlesource.com/kernel/common'
            kref: 'deprecated/android-4.19-stable'
            tc: gcc
          - ver: '5.4'
            krepo: 'https://android.googlesource.com/kernel/common'
            kref: 'android11-5.4'
            tc: clang
          - ver: '5.10'
            krepo: 'https://android.googlesource.com/kernel/common'
            kref: 'android12-5.10'
            tc: clang
          - ver: '5.15'
            krepo: 'https://android.googlesource.com/kernel/common'
            kref: 'android13-5.15'
            tc: clang
          - ver: '6.1'
            krepo: 'https://android.googlesource.com/kernel/common'
            kref: 'android14-6.1'
            tc: clang
          - ver: '6.6'
            krepo: 'https://android.googlesource.com/kernel/common'
            kref: 'android15-6.6'
            tc: clang
          - ver: '6.12'
            krepo: 'https://android.googlesource.com/kernel/common'
            kref: 'android16-6.12'
            tc: clang
          - ver: '6.18'
            krepo: 'https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git'
            kref: 'linux-6.18.y'
            tc: clang
    env:
      CCACHE_MAXSIZE: '2G'
      CCACHE_DIR: /home/runner/.ccache
    steps:
      - name: Select
        id: sel
        env:
          ONLY: ${{ inputs.only }}
          VER: ${{ matrix.ver }}
        run: |
          if [ -z "$ONLY" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          for v in ${ONLY//,/ }; do
            if [ "$v" = "$VER" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "run=0" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipped $VER (not in 'only' filter)"

      - name: Checkout hookless (src + patches)
        if: steps.sel.outputs.run == '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: repo

      - name: Install build deps
        if: steps.sel.outputs.run == '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio kmod \
            build-essential git ca-certificates rsync ccache sparse \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          if [ "${{ matrix.tc }}" = "clang" ]; then
            sudo apt-get install -y --no-install-recommends clang lld llvm
            clang --version | head -1
          else
            aarch64-linux-gnu-gcc --version | head -1
          fi
          for n in clang clang++ gcc g++ cc c++ aarch64-linux-gnu-gcc aarch64-linux-gnu-g++; do
            sudo ln -sf /usr/bin/ccache "/usr/lib/ccache/$n"
          done
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

      - name: Restore ccache
        if: steps.sel.outputs.run == '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.ver }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.ver }}-

      - name: Restore kernel clone
        if: steps.sel.outputs.run == '1'
        id: kcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ksrc
          key: ksrc-${{ matrix.ver }}-${{ matrix.kref }}-v1

      - name: Clone kernel source (${{ matrix.kref }}) on cache miss
        if: steps.sel.outputs.run == '1' && steps.kcache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --depth 1 -b "${{ matrix.kref }}" "${{ matrix.krepo }}" ksrc
          echo "Kernel: $(head -3 ksrc/Makefile | tr '\n' ' ')"

      - name: Save kernel clone (pristine) on cache miss
        if: steps.sel.outputs.run == '1' && steps.kcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ksrc
          key: ksrc-${{ matrix.ver }}-${{ matrix.kref }}-v1

      - name: Apply hookless patch + drop in source
        if: steps.sel.outputs.run == '1'
        run: |
          set -e
          cd ksrc
          P="$GITHUB_WORKSPACE/repo/hookless/patches/nomount_kernel_integration.patch"
          git apply -p1 --check "$P" || {
            echo "fatal: the integration patch no longer applies cleanly to ${{ matrix.ver }}"; exit 1; }
          patch -p1 --forward --fuzz=3 < "$P"
          cp "$GITHUB_WORKSPACE/repo/hookless/src/nomount.c" fs/nomount.c
          cp "$GITHUB_WORKSPACE/repo/hookless/src/nomount.h" fs/nomount.h
          grep -n 'CONFIG_NOMOUNT' fs/Makefile fs/Kconfig || true

      - name: Configure + compile fs/nomount.o
        id: build
        if: steps.sel.outputs.run == '1'
        run: |
          set -o pipefail
          cd ksrc
          if [ "${{ matrix.tc }}" = "clang" ]; then
            MAKEOPTS="arch=arm64 O=out llvm=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS=-Wno-error"
          else
            MAKEOPTS="arch=arm64 O=out CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS=-Wno-error"
          fi
          echo "MAKEOPTS=$MAKEOPTS" >> "$GITHUB_ENV"
          echo "== assert fs/Makefile + fs/Kconfig hunks applied =="
          grep -q 'obj-$(CONFIG_NOMOUNT) += nomount.o' fs/Makefile || {
            echo "fatal: fs/Makefile hunk did not apply for ${{ matrix.ver }} -- nomount.o would never be linked"; exit 1; }
          grep -qE '^config NOMOUNT' fs/Kconfig || {
            echo "fatal: fs/Kconfig hunk did not apply for ${{ matrix.ver }}"; exit 1; }

          echo "== defconfig =="
          make $MAKEOPTS defconfig 2>&1 | tail -5
          ./scripts/config --file out/.config -e NOMOUNT
          make $MAKEOPTS olddefconfig 2>&1 | tail -5
          grep -q '^CONFIG_NOMOUNT=y' out/.config || {
            echo "fatal: CONFIG_NOMOUNT did not stick in .config for ${{ matrix.ver }}"; exit 1; }
          echo "== prepare =="
          make $MAKEOPTS prepare 2>&1 | tail -20
          echo "== compile fs/nomount.o =="
          make $MAKEOPTS fs/nomount.o 2>&1 | tee /tmp/nm_build.log
          ls -l out/fs/nomount.o && echo "COMPILE_OK ${{ matrix.ver }}"
          echo "== assert task_mmu.c hook present =="
          grep -q 'vfs_map_meta_override' fs/proc/task_mmu.c || {
            echo "fatal: integration patch did not apply its task_mmu.c hunk for ${{ matrix.ver }}"; exit 1; }
          awk '/^(static )?[a-zA-Z_].*\(/{last=$0} /vfs_map_meta_override\(inode/{print last; found=1; exit}
               END{ if(!found) exit 1 }' fs/proc/task_mmu.c | grep -q 'show_map_vma' || {
            echo "fatal: task_mmu.c hunk applied outside show_map_vma for ${{ matrix.ver }} (fuzzy misplacement)"; exit 1; }
          echo "== compile fs/proc/task_mmu.o =="
          make $MAKEOPTS fs/proc/task_mmu.o 2>&1 | tee /tmp/tm_build.log
          ls -l out/fs/proc/task_mmu.o && echo "TASK_MMU_OK ${{ matrix.ver }}"
          aarch64-linux-gnu-nm --defined-only out/fs/nomount.o | grep -q 'vfs_map_meta_override' || {
            echo "fatal: the maps-cloak global is missing or renamed for ${{ matrix.ver }}"; exit 1; }
          ccache -s 2>/dev/null | grep -iE 'hit|miss' || true

      - name: W=1 gate + sparse (advisory)
        if: steps.sel.outputs.run == '1' && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          cd ksrc
          echo "== W=1 =="
          rm -f out/fs/nomount.o
          if ! make $MAKEOPTS W=1 fs/nomount.o 2>&1 | tee /tmp/nm_w1.log; then
            echo "fatal: the W=1 build of fs/nomount.o failed for ${{ matrix.ver }}"
            exit 1
          fi
          echo "== sparse C=2 (advisory) =="
          rm -f out/fs/nomount.o
          make $MAKEOPTS C=2 CHECK="sparse" fs/nomount.o 2>&1 | tee /tmp/nm_sparse.log || true
          w=$(grep 'warning:' /tmp/nm_w1.log 2>/dev/null | grep -c 'nomount\.[ch]' || true)
          s=$(grep 'warning:\|error:' /tmp/nm_sparse.log 2>/dev/null | grep -c 'nomount\.[ch]' || true)
          echo "::notice::${{ matrix.ver }} (nomount.c only) - W=1 warnings: ${w:-0}, sparse notes: ${s:-0}"
          W1_BASELINE=0
          if [ "${w:-0}" -gt "$W1_BASELINE" ]; then
            echo "== W=1 warnings in nomount.[ch] =="
            grep 'warning:' /tmp/nm_w1.log | grep 'nomount\.[ch]' || true
            echo "fatal: ${{ matrix.ver }} has ${w} W=1 warning(s) in nomount.[ch], baseline ${W1_BASELINE}"
            exit 1
          fi

      - name: Save ccache
        if: ${{ always() && steps.sel.outputs.run == '1' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.ver }}-${{ github.run_id }}

      - name: Upload logs
        if: ${{ always() && steps.sel.outputs.run == '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: log-${{ matrix.ver }}
          path: |
            /tmp/nm_build.log
            /tmp/nm_w1.log
            /tmp/nm_sparse.log
          if-no-files-found: ignore

  summary:
    name: summary
    needs: compile
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Render result grid
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## NoMount hookless - compile matrix"
            echo ""
            echo "| kernel | fs/nomount.o |"
            echo "|--------|--------------|"
            gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --json jobs \
              --jq '.jobs[] | select(.name|test("^[0-9]")) | "| \(.name) | \(if .conclusion=="success" then "✅ pass" elif .conclusion=="skipped" then "⏭ skip" else "❌ "+(.conclusion//"?") end) |"' \
              | sort -V
          } >> "$GITHUB_STEP_SUMMARY"
