name: NoMount Suite - module zip

on:
  # Called by release.yml on a v* tag, so the published zip is built by
  # exactly these jobs rather than a parallel pipeline.
  #
  # No inputs on either trigger any more: the only one there has ever been was
  # `only`, which selected kernel versions for the compile matrix, and the matrix
  # is gone. See the note at the top of `jobs:`.
  workflow_call:
  workflow_dispatch:
  push:
    # ONE branch. `prerelease` is where the work lands, so it is where the work is
    # checked.
    #
    # `main` used to be here too, and every push to it was a duplicate: a release
    # is `git push newrepo prerelease:main`, a fast-forward, so those 21 runs (of
    # 82, over eleven days) rebuilt a tree that prerelease had already built and
    # tested minutes earlier - and then the `v*` tag fired a THIRD identical
    # pipeline through release.yml. Two of the three proved nothing.
    #
    # `master` and `suite` were dead strings: neither branch exists on this
    # remote. They were here because this file also shipped to
    # `Bouteillepleine/nomount`, whose default is `master` and whose `suite`
    # branch was the working one - that stopped being true on 2026-08-29, when
    # `suite` froze and this repository became the live one.
    #
    # ACCEPTED CAVEAT: a commit landing directly on `main` without passing through
    # `prerelease` builds nothing until a tag reaches it. Nothing does that today
    # except release.yml's own update.json commit, which is `paths-ignore`d below
    # anyway. If it ever happens, dispatch this workflow by hand.
    branches: [prerelease]
    # A README edit is not a build. Without this, every documentation commit
    # spent a couple of minutes producing a zip identical to the last one, and
    # the run list read as a wall of "readme:" entries with the real builds
    # buried among them.
    #
    # CAVEAT: GitHub applies path filters to tag pushes too. If a `v*` tag ever
    # lands on a commit that touched only documentation, this workflow will not
    # fire and no release will be published. Release tags here follow a version
    # bump in Cargo.toml and module.prop, so that case does not arise in
    # practice - but if it ever does, run the workflow manually.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitattributes'
      # Written by release.yml's publish job, which commits it to main right
      # after a release goes out. Building for it would rebuild the zip that was
      # just published, from the same tree, to no purpose.
      - 'update.json'

# Least privilege: this workflow only builds and uploads artifacts.
permissions:
  contents: read

# Every `uses:` below is pinned to a commit, with the tag it corresponded to in a
# trailing comment. A tag is a movable pointer in someone else's repository, so
# `@v4` is a standing agreement to run whatever they publish next, inside a job
# that builds the root binary this project ships. The cost is that a pin has to
# be bumped by hand; the comment is what makes that a two-minute job rather than
# an archaeology exercise. Do not replace these with tags again.
#
# Node 20 is end-of-life on the runners, so the four GitHub-owned actions are on
# their node24 releases: checkout v7, cache v6, upload-artifact v7,
# download-artifact v8. Each bump was checked rather than assumed - every input
# this workflow passes still exists in the new version, cache/restore still
# exposes `cache-hit`, and download-artifact still defaults to one subdirectory
# per artifact name, which the package job below reads.
#
# `mlugg/setup-zig` is deliberately not bumped: v2.2.1 is its newest release and
# still declares node20, so it stays and the runner keeps forcing it onto node24.
# That warning is upstream's to clear and is the only one that should remain.
# `dtolnay/rust-toolchain` is a composite action - no JS runtime, unaffected.

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: r27c
  NDK_HOME: /opt/ndk

jobs:
  # NO `engine-changed` job and NO `compile-matrix` job. The ten-version kernel
  # compile gate (.github/workflows/hookless-compile-matrix.yml) is gone from this
  # branch entirely, and `build-kpm.yml` with it.
  #
  # What that costs, stated plainly rather than buried: the matrix was the only
  # thing that ran `git apply --check` of hookless/patches/nomount_kernel_integration.patch
  # against a real tree for each kernel, and the only thing that asserted the
  # fs/Makefile and fs/Kconfig hunks actually landed. That is the check that caught
  # five patches carrying malformed hunk headers, which had been green for months.
  # Nothing here replaces it now - an engine change is verified by the kernel
  # builders and on a phone, or it is not verified.
  #
  # Both files are recoverable from history: `git show <sha>:.github/workflows/hookless-compile-matrix.yml`
  # where <sha> is the commit before this one. The LKM and KPM branches still carry
  # their own copies of the matrix, and `build-lkm.yml` on the LKM branch still runs
  # its own out-of-tree compile gate over all ten versions - so the coverage exists,
  # it just no longer runs on every push here.

  # The unit tests are host tests (no NDK, no device), so they cost a minute and
  # gate the thing that actually ships: `package` needs them green. `build` is
  # deliberately not gated - the cross-compile is the slowest leg and there is no
  # reason to hold it behind a fast check that cannot break it. A red test simply
  # means no ZIP comes out the far end.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-host-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-host-test-

      - name: Test
        run: cargo test --locked

      # --locked, like Test above. `test` was the only job pinned to Cargo.lock,
      # so clippy and the cross-compile were free to resolve a different
      # transitive set from the one the tests were green against.
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # The Rust is linted on every push; the shell was not, and the module is
      # eight scripts that run as root at boot. Every bug found in the 2026-08-25
      # audit session was in shell, not Rust: a uid parser that split on a space
      # where the file uses a tab, a `\|` alternation toybox does not support, a
      # `[ -e ]` that cannot tell enoent from eacces.
      #
      # -s sh, because /system/bin/sh is mksh/ash, not bash.
      #
      # INFO level, and NO rule exclusions. It was `warning` at first, and that is
      # one level above the check that matters most here: SC2086 (unquoted
      # expansion) is info severity, so the gate could not see `find $_roots` in
      # metamount.sh - a find argument list built from third-party module
      # Directory names, where one space splits it in two. Everything the lower
      # level newly reports is either fixed or carries an inline `disable` with
      # its reason, which is the form that stays attached to the line it excuses;
      # a bare -e list here would hide them from the file that needs them.
      #
      # -x, so a `. "$MODDIR/lib.sh"` is followed. Without it every helper the
      # entry points share reads as an undefined command and every variable
      # lib.sh sets reads as unused - i.e. the gate would punish the
      # deduplication it exists to make safe.
      #
      # Honest about what this does not catch: shellcheck says nothing about
      # `for x in $list`, because splitting there is usually intended, so the
      # newline-IFS bug in the ghost populator would still have got through at
      # any level.
      - name: Shellcheck module scripts
        run: |
          sudo apt-get install -y shellcheck >/dev/null 2>&1 || true
          shellcheck -x -s sh -S info -f gcc module/*.sh
          # ...and the build script, which was the one shell file CI did not read
          # - while being the thing that assembles the zip everybody flashes.
          # bash, not sh: it uses arrays and [[ ]] deliberately, and it runs on a
          # workstation rather than on the phone.
          shellcheck -s bash -S info -f gcc scripts/package.sh
          # ...and the kernel side, now that it lives here. One repo, one gate
          # set: the engine's verify script is a root shell script on a device
          # just like the module's are.
          shellcheck -s sh -S info -f gcc hookless/*.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [debug, release]
        # OnePlus (and anything that can run this kernel) is arm64-v8a only, and
        # the module loads bin/$(getprop ro.product.cpu.abi) = arm64-v8a at
        # runtime - so build and ship just arm64. Re-add targets for wider reach.
        target: [aarch64-linux-android]
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install NDK
        run: |
          set -euo pipefail
          curl -sSfL "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -o ndk.zip
          # Verify it. This unpacks a 700 MB archive from a cdn and then compiles
          # the root binary this project ships with the toolchain inside it, and
          # nothing checked that the bytes were the ones Google published.
          #
          # sha1, because sha1 is the only digest Google's own package manifest
          # carries (repository2-3.xml, <checksum type="sha1">). That is the right
          # property for this job: what is needed here is second-preimage
          # resistance - "is this the r27c everyone else got?" - and sha1 is not
          # broken for that. It is broken for collisions, which would matter only
          # if the NDK's publisher were the attacker.
          echo "${NDK_SHA1}  ndk.zip" | sha1sum -c - || {
            echo "::error::NDK archive does not match the checksum Google publishes for ${NDK_VERSION}"
            exit 1
          }
          unzip -q ndk.zip -d /opt
          mv /opt/android-ndk-${NDK_VERSION} ${NDK_HOME}
        env:
          # From https://dl.google.com/android/repository/repository2-3.xml
          # (<remotePackage path="ndk;27.2.12479018">, android-ndk-r27c-linux.zip).
          # Bump this in the same commit as NDK_VERSION, never separately.
          NDK_SHA1: 090e8083a715fdb1a3e402d0763c388abb03fb4e

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ matrix.profile }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-${{ matrix.profile }}-

      - name: Build
        run: |
          export PATH="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          FLAGS=""
          if [ "$PROFILE" = "release" ]; then
            FLAGS="--release"
          fi
          # --locked: this is the build that produces the shipped binary, and it
          # was the one leg free to resolve a different transitive dependency set
          # from the one `test` was green against.
          cargo build --locked $FLAGS --target "$TARGET"
        env:
          PROFILE: ${{ matrix.profile }}
          TARGET: ${{ matrix.target }}
          # arm64 only, like the matrix above. The armv7/x86_64/i686 linkers named
          # targets this workflow has never built.
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: /opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang

      - name: Assert debug info preserved
        if: matrix.profile == 'debug'
        run: |
          bin="target/${TARGET}/debug/nomount"
          file "$bin"
          if ! readelf -S "$bin" | grep -q debug_info; then
            echo "::error::debug binary missing debug_info section"
            exit 1
          fi
        env:
          TARGET: ${{ matrix.target }}

      - name: Assert stripped
        if: matrix.profile == 'release'
        run: |
          bin="target/${TARGET}/release/nomount"
          file "$bin"
          if readelf -S "$bin" | grep -q debug_info; then
            echo "::error::release binary still contains debug_info"
            exit 1
          fi
        env:
          TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.abi }}-${{ matrix.profile }}
          path: target/${{ matrix.target }}/${{ matrix.profile }}/nomount
          # Intermediate: `package` downloads this in the same run and nothing
          # else ever wants it. At 7 days these were the largest thing in the
          # artifact store by a wide margin.
          retention-days: 1

  package:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Place binaries into target tree
        run: |
          declare -A ABI_TARGET=(
            [arm64-v8a]=aarch64-linux-android
          )
          for profile in debug release; do
            for abi in "${!ABI_TARGET[@]}"; do
              target="${ABI_TARGET[$abi]}"
              src="artifacts/bin-${abi}-${profile}/nomount"
              dst="target/${target}/${profile}/nomount"
              mkdir -p "$(dirname "$dst")"
              cp "$src" "$dst"
              chmod +x "$dst"
            done
          done

      - name: Setup zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.1

      - name: Build nm (freestanding netlink client)
        run: |
          # The module shells out to bin/<abi>/nm; it is arch-shared C, built
          # once here. Same zig incantation as the nomount source repo, then
          # sstrip to ~3 KB. Placed next to nomount so package.sh bundles it.
          make -C userspace/tools/sstrip
          zig cc -target aarch64-linux -Oz -static -nostdlib -ffreestanding \
            -fno-unwind-tables -fno-ident -Wno-invalid-noreturn -Wl,--entry=_start \
            userspace/src/nm.c -o nm-arm64
          userspace/tools/sstrip/sstrip -z nm-arm64
          file nm-arm64; wc -c nm-arm64
          for profile in debug release; do
            install -Dm755 nm-arm64 "target/aarch64-linux-android/${profile}/nm"
          done

      - name: Read version
        id: ver
        run: |
          ver=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=v${ver}" >> "$GITHUB_OUTPUT"

      - name: Package ZIPs
        run: scripts/package.sh --version "$VER"
        env:
          VER: ${{ steps.ver.outputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nomount-release-zip
          path: release/release/00_NoMount-Module-*.zip
          retention-days: 30

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nomount-debug-zip
          path: release/debug/00_NoMount-Module-*.zip
          # Shorter than the release zip: useful to attach to a bug report,
          # not something that should accumulate for a month.
          retention-days: 7


  # NO publish job lives here any more. It is `release.yml`, which calls this
  # workflow as a reusable one and publishes the artifact `package` uploads
  # above - so the zip on a release page is built by exactly these jobs and not
  # by a parallel pipeline. It had to move because this file gained a
  # `paths-ignore` filter, and GitHub applies path filters to tag pushes too: a
  # `v*` tag landing on a documentation-only commit would have filtered the whole
  # workflow out and published nothing, silently. This comment described the job
  # that left; the description of what replaced it is at the top of release.yml.
