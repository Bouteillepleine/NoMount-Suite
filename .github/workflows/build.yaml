name: NoMount Suite - module zip

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [prerelease, main, lkm-port]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitattributes'
      - 'update.json'
  pull_request:
    branches: [prerelease, main, lkm-port]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitattributes'
      - 'update.json'

concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: r27c
  NDK_HOME: /opt/ndk

jobs:

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: clippy

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-host-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-host-test-

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Shellcheck module scripts
        run: |
          sudo apt-get install -y shellcheck >/dev/null 2>&1 || true
          shellcheck -x -s sh -S info -f gcc module/*.sh
          shellcheck -s bash -S info -f gcc scripts/package.sh scripts/gate-sweep.sh
          shellcheck -s sh -S info -f gcc hookless/*.sh

      - name: Module shell tests
        run: sh tests/lkm-load.sh

      - name: Engine config-gate sweep
        run: bash scripts/gate-sweep.sh

      - name: WebUI load order
        run: node scripts/webui-loadorder.js

      - name: Case-only-change sweep
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE"
          sha="$HEAD_SHA"
          usable=yes
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              usable=no
          elif ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              usable=no
          fi
          if [ "$usable" = no ]; then
              prev="$(git describe --tags --abbrev=0 "$sha^" 2>/dev/null || true)"
              if [ -n "$prev" ] && git cat-file -e "$prev^{commit}" 2>/dev/null; then
                  echo "no usable base ($base) - sweeping $prev..$sha"
                  python3 scripts/case-sweep.py "$prev..$sha"
              else
                  echo "no usable base ($base) and no previous tag - checking $sha alone"
                  python3 scripts/case-sweep.py "$sha"
              fi
          else
              python3 scripts/case-sweep.py "$base..$sha"
          fi

  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        profile: [debug, release]
        target: [aarch64-linux-android]
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install NDK
        run: |
          set -euo pipefail
          curl -sSfL "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -o ndk.zip
          echo "${NDK_SHA1}  ndk.zip" | sha1sum -c - || {
            echo "::error::NDK archive does not match the checksum Google publishes for ${NDK_VERSION}"
            exit 1
          }
          unzip -q ndk.zip -d /opt
          mv /opt/android-ndk-${NDK_VERSION} ${NDK_HOME}
        env:
          NDK_SHA1: 090e8083a715fdb1a3e402d0763c388abb03fb4e

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ matrix.profile }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-${{ matrix.profile }}-

      - name: Build
        run: |
          export PATH="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          FLAGS=""
          if [ "$PROFILE" = "release" ]; then
            FLAGS="--release"
          fi
          cargo build --locked $FLAGS --target "$TARGET"
        env:
          PROFILE: ${{ matrix.profile }}
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: /opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang

      - name: Assert debug info preserved
        if: matrix.profile == 'debug'
        run: |
          bin="target/${TARGET}/debug/nomount"
          file "$bin"
          if ! readelf -S "$bin" | grep -q debug_info; then
            echo "::error::debug binary missing debug_info section"
            exit 1
          fi
        env:
          TARGET: ${{ matrix.target }}

      - name: Assert stripped
        if: matrix.profile == 'release'
        run: |
          bin="target/${TARGET}/release/nomount"
          file "$bin"
          if readelf -S "$bin" | grep -q debug_info; then
            echo "::error::release binary still contains debug_info"
            exit 1
          fi
        env:
          TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.abi }}-${{ matrix.profile }}
          path: target/${{ matrix.target }}/${{ matrix.profile }}/nomount
          retention-days: 1

  kmi-modules:
    name: ko ${{ matrix.kmi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kmi: android12-5.10, tag: '20251104' }
          - { kmi: android13-5.10, tag: '20251104' }
          - { kmi: android13-5.15, tag: '20251104' }
          - { kmi: android14-5.15, tag: '20251104' }
          - { kmi: android14-6.1,  tag: '20251104' }
          - { kmi: android15-6.6,  tag: '20251104' }
          - { kmi: android16-6.12, tag: '20251104' }
          - { kmi: android17-6.18, tag: '20260828' }
    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.kmi }}-${{ matrix.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          set -eu
          test -s "$KDIR/Module.symvers" || {
            echo "::error::no Module.symvers in the DDK tree"; exit 1; }
          make -j"$(nproc)" -C "$KDIR" ARCH=arm64 CC=clang \
               M="$GITHUB_WORKSPACE/lkm" modules
          install -Dm644 lkm/nomount.ko "out/nomount-${{ matrix.kmi }}.ko"
          llvm-strip -d "out/nomount-${{ matrix.kmi }}.ko" || true
          ls -l "out/nomount-${{ matrix.kmi }}.ko"

      - name: Relocations the arm64 module loader cannot apply
        run: |
          set -eu
          KO="out/nomount-${{ matrix.kmi }}.ko"
          for c in llvm-readelf readelf; do
            command -v "$c" >/dev/null 2>&1 && { RE="$c"; break; }
          done
          [ -n "${RE:-}" ] || { echo "no readelf in this image"; exit 1; }
          ALLOW='^R_AARCH64_(NONE|ABS(64|32|16)|PREL(64|32|16)|MOVW_UABS_G[0-3](_NC)?|MOVW_SABS_G[0-2]|MOVW_PREL_G[0-3](_NC)?|LD_PREL_LO19|ADR_PREL_LO21|ADR_PREL_PG_HI21(_NC)?|ADD_ABS_LO12_NC|LDST(8|16|32|64|128)_ABS_LO12_NC|TSTBR14|CONDBR19|JUMP26|CALL26)$'
          # -W matters: without it readelf truncates R_AARCH64_LD64_GOT_LO12_NC
          # to "R_AARCH64_LD64_GO", which no longer contains the string GOT.
          BAD=$("$RE" -rW "$KO" | awk '/^0/{print $3}' | sort -u | grep -vE "$ALLOW" || true)
          [ -z "$BAD" ] && { echo "all relocation types are ones the loader applies"; exit 0; }
          echo "::error::$KO carries relocations the arm64 module loader cannot apply - it would fail insmod"
          echo "$BAD"
          for t in $BAD; do
            "$RE" -rW "$KO" | awk -v t="$t" '$3==t && NF>=5 {print "  " t "  " $5}' | sort -u
          done
          exit 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ko-${{ matrix.kmi }}
          path: out/nomount-${{ matrix.kmi }}.ko
          if-no-files-found: error
          retention-days: 1

  package:
    needs: [build, test, kmi-modules]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Place binaries into target tree
        run: |
          declare -A ABI_TARGET=(
            [arm64-v8a]=aarch64-linux-android
          )
          for profile in debug release; do
            for abi in "${!ABI_TARGET[@]}"; do
              target="${ABI_TARGET[$abi]}"
              src="artifacts/bin-${abi}-${profile}/nomount"
              dst="target/${target}/${profile}/nomount"
              mkdir -p "$(dirname "$dst")"
              cp "$src" "$dst"
              chmod +x "$dst"
            done
          done

      - name: Stage the engine modules
        run: |
          set -eu
          mkdir -p module/lkm
          find artifacts -name 'nomount-*.ko' -exec cp {} module/lkm/ \;
          n=$(find module/lkm -name 'nomount-*.ko' | wc -l)
          find module/lkm -name 'nomount-*.ko' -printf '  %f  %s bytes\n' | sort
          [ "$n" -eq 8 ] || { echo "::error::expected 8 engine modules, got $n"; exit 1; }

      - name: Setup zig
        env:
          ZIG_VERSION: 0.14.1
          ZIG_SHA256: 24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c
        run: |
          set -euo pipefail
          # Was mlugg/setup-zig. Its newest release is also its main branch and still
          # declares node20, so every build carried a deprecation annotation with no
          # version to move to. The tarball needs no action, and the hash is pinned.
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/zig.tar.xz" "$url"
          echo "${ZIG_SHA256}  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig/zig" version

      - name: Build ko-loader
        run: |
          set -eu
          git clone https://github.com/maxsteeel/ko-loader /tmp/kol
          git -C /tmp/kol checkout -q af7fb29222377181220d9814f46b6a8b12cb770c
          make -C /tmp/kol TARGET=aarch64-linux
          make -C userspace/tools/sstrip
          userspace/tools/sstrip/sstrip -z /tmp/kol/lkmloader
          install -Dm755 /tmp/kol/lkmloader module/bin/ko-loader-arm64
          file module/bin/ko-loader-arm64

      - name: Build nm (freestanding netlink client)
        run: |
          make -C userspace/tools/sstrip
          zig cc -target aarch64-linux -Oz -static -nostdlib -ffreestanding \
            -fno-unwind-tables -fno-ident -Wno-invalid-noreturn -Wl,--entry=_start \
            userspace/src/nm.c -o nm-arm64
          userspace/tools/sstrip/sstrip -z nm-arm64
          file nm-arm64; wc -c nm-arm64
          for profile in debug release; do
            install -Dm755 nm-arm64 "target/aarch64-linux-android/${profile}/nm"
          done

      - name: Read version
        id: ver
        run: |
          ver=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=v${ver}" >> "$GITHUB_OUTPUT"

      - name: Package ZIPs
        run: scripts/package.sh --version "$VER"
        env:
          VER: ${{ steps.ver.outputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nomount-release-zip
          path: |
            release/release/00_NoMount-Module-*.zip
            release/release/01_NoMount-Module-LKM-*.zip
          retention-days: 30

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nomount-debug-zip
          path: |
            release/debug/00_NoMount-Module-*.zip
            release/debug/01_NoMount-Module-LKM-*.zip
          retention-days: 7
