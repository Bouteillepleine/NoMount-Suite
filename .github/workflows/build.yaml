name: NoMount Suite - module zip

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [master, main, suite, prerelease]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitattributes'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: r27c
  NDK_HOME: /opt/ndk

jobs:
  engine-changed:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.f.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: f
        run: |
          set -eu
          if [ "$(git rev-list --count HEAD)" -lt 2 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only HEAD^ HEAD \
               | grep -qE '^hookless/(src|patches)/|^\.github/workflows/hookless-compile-matrix\.yml$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  compile-matrix:
    needs: engine-changed
    if: needs.engine-changed.outputs.changed == 'true'
    uses: ./.github/workflows/hookless-compile-matrix.yml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-host-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-host-test-

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Shellcheck module scripts
        run: |
          sudo apt-get install -y shellcheck >/dev/null 2>&1 || true
          shellcheck -s sh -S warning -f gcc module/*.sh
          shellcheck -s bash -S warning -f gcc scripts/package.sh
          shellcheck -s sh -S warning -f gcc hookless/*.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [debug, release]
        target: [aarch64-linux-android]
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install NDK
        run: |
          set -euo pipefail
          curl -sSfL "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -o ndk.zip
          echo "${NDK_SHA1}  ndk.zip" | sha1sum -c - || {
            echo "::error::NDK archive does not match the checksum Google publishes for ${NDK_VERSION}"
            exit 1
          }
          unzip -q ndk.zip -d /opt
          mv /opt/android-ndk-${NDK_VERSION} ${NDK_HOME}
        env:
          NDK_SHA1: 090e8083a715fdb1a3e402d0763c388abb03fb4e

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ matrix.profile }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-${{ matrix.profile }}-

      - name: Build
        run: |
          export PATH="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          FLAGS=""
          if [ "$PROFILE" = "release" ]; then
            FLAGS="--release"
          fi
          cargo build $FLAGS --target "$TARGET"
        env:
          PROFILE: ${{ matrix.profile }}
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: /opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: /opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: /opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang
          CARGO_TARGET_I686_LINUX_ANDROID_LINKER: /opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android26-clang

      - name: Assert debug info preserved
        if: matrix.profile == 'debug'
        run: |
          bin="target/${TARGET}/debug/nomount"
          file "$bin"
          if ! readelf -S "$bin" | grep -q debug_info; then
            echo "::error::debug binary missing debug_info section"
            exit 1
          fi
        env:
          TARGET: ${{ matrix.target }}

      - name: Assert stripped
        if: matrix.profile == 'release'
        run: |
          bin="target/${TARGET}/release/nomount"
          file "$bin"
          if readelf -S "$bin" | grep -q debug_info; then
            echo "::error::release binary still contains debug_info"
            exit 1
          fi
        env:
          TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.abi }}-${{ matrix.profile }}
          path: target/${{ matrix.target }}/${{ matrix.profile }}/nomount
          retention-days: 1

  package:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Place binaries into target tree
        run: |
          declare -A ABI_TARGET=(
            [arm64-v8a]=aarch64-linux-android
          )
          for profile in debug release; do
            for abi in "${!ABI_TARGET[@]}"; do
              target="${ABI_TARGET[$abi]}"
              src="artifacts/bin-${abi}-${profile}/nomount"
              dst="target/${target}/${profile}/nomount"
              mkdir -p "$(dirname "$dst")"
              cp "$src" "$dst"
              chmod +x "$dst"
            done
          done

      - name: Setup zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.1

      - name: Build nm (freestanding netlink client)
        run: |
          make -C userspace/tools/sstrip
          zig cc -target aarch64-linux -Oz -static -nostdlib -ffreestanding \
            -fno-unwind-tables -fno-ident -Wno-invalid-noreturn -Wl,--entry=_start \
            userspace/src/nm.c -o nm-arm64
          userspace/tools/sstrip/sstrip -z nm-arm64
          file nm-arm64; wc -c nm-arm64
          for profile in debug release; do
            install -Dm755 nm-arm64 "target/aarch64-linux-android/${profile}/nm"
          done

      - name: Read version
        id: ver
        run: |
          ver=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=v${ver}" >> "$GITHUB_OUTPUT"

      - name: Package ZIPs
        run: scripts/package.sh --version "$VER"
        env:
          VER: ${{ steps.ver.outputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nomount-release-zip
          path: release/release/00_NoMount-Module-*.zip
          retention-days: 30

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nomount-debug-zip
          path: release/debug/00_NoMount-Module-*.zip
          retention-days: 7
