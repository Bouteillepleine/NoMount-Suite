name: NoMount KPM — build a KernelPatch module

# Builds kpm/ into one nomount-<kmi>.kpm per GKI KMI generation.
#
# WHY PER KMI, AND WHY IN THE DDK CONTAINERS -- a correctness argument here, not
# just a speed one.
#
# The engine half of a .kpm is compiled against real kernel headers because it
# dereferences struct inode, dentry and super_block. Those layouts depend on the
# kernel's CONFIG, so building against a generic `make defconfig` tree can give
# field offsets that do not match the GKI kernel the module is loaded into -- and
# that failure is not a link error, it is reading the wrong bytes at runtime.
# The DDK's $KDIR is a released GKI kernel's own configured tree, so the layouts
# are the ones the device actually has.
#
# It is also what makes the KMI generation the right unit: android12-5.10 and
# android13-5.10 are the same kernel version and different KMIs, and nothing
# about a version number promises the structs agree.
#
# WHY THE SYMBOL LIST IS THE HARD PART, and why it is generated, not written.
#
# A .kpm gets no relocation against the kernel's export table: KernelPatch's
# loader resolves undefined symbols against its OWN table only
# (kernel/patch/module/module.c, simplify_symbols) and the kallsyms fallback
# there is commented out because "kernel symbol cause overflow in relocation" --
# an AArch64 `bl` reaches only +/-128 MB. So every kernel call has to become an
# indirect call through a table, which is what kpm/nm_kpm_tramp.c does.
#
# The list also cannot be scraped from modpost, which caps its output
# ("suppressed 90 unresolved symbol warnings") and under-reports. `nm -u` over
# the compiled engine is exact, and that is what the survey step runs.
#
# VERSION CAP. KernelPatch does not come up on 6.12+ -- it hangs in its own
# pagetable bring-up, so a module built for it could never load. The matrix stops
# at 6.6, and kpm/nm_kpm_shim.h fails the compile if anything tries to go higher.
# See kpm/README.md.

on:
  push:
    branches: [KPM]
    paths:
      - 'kpm/**'
      - 'hookless/src/**'
      - '.github/workflows/build-kpm.yml'
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated KMIs (empty = all). e.g. android15-6.6"
        required: false
        default: ''
      variant_ref:
        description: "Branch holding kpm/ (this file lives on main; the code does not)"
        required: false
        default: 'KPM'
      kp_repo:
        description: "KernelPatch SDK repo"
        required: false
        default: 'https://github.com/bmax121/KernelPatch'
      kp_ref:
        description: "KernelPatch ref (empty = its default branch)"
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: kpm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.kmi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Stops at 6.6 on purpose -- see the version-cap note above.
        # android11-5.4 is absent because the DDK publishes no container for it;
        # that is a real coverage gap, not an oversight.
        include:
          - { kmi: android12-5.10, tag: '20251104' }
          - { kmi: android13-5.10, tag: '20251104' }
          - { kmi: android13-5.15, tag: '20251104' }
          - { kmi: android14-5.15, tag: '20251104' }
          - { kmi: android14-6.1,  tag: '20251104' }
          - { kmi: android15-6.6,  tag: '20251104' }
    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.kmi }}-${{ matrix.tag }}
    steps:
      - name: Should this KMI run?
        id: sel
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -eu
          if [ -z "${ONLY:-}" ] || printf '%s' "$ONLY" | tr ',' '\n' | grep -qx '${{ matrix.kmi }}'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"; echo "skipped ${{ matrix.kmi }}"
          fi

      # kpm/ lives on its own branch, but GitHub only offers a workflow_dispatch
      # file that sits on the default branch. So this file is on main and checks
      # the variant branch out explicitly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.sel.outputs.run == '1'
        with:
          ref: ${{ github.event.inputs.variant_ref || 'KPM' }}

      - name: Validate the tree and the DDK
        if: steps.sel.outputs.run == '1'
        run: |
          set -eu
          test -f kpm/Makefile || { echo "::error::no kpm/Makefile on this ref"; exit 1; }
          test -f hookless/src/nomount.c || {
            echo "::error::engine source missing; kpm/ includes it"; exit 1; }
          if [ -z "${KDIR:-}" ] || [ ! -f "$KDIR/Makefile" ]; then
            echo "::error::KDIR unusable in this container: ${KDIR:-<empty>}"; exit 1
          fi
          # The engine object needs the generated headers, not Module.symvers --
          # a .kpm resolves through kallsyms, so an export table would not help
          # it. This is the one thing that must be present.
          test -f "$KDIR/include/generated/autoconf.h" || {
            echo "::error::no generated headers in \$KDIR"; exit 1; }
          echo "KMI ${{ matrix.kmi }}, KDIR=$KDIR"

      - name: Cross toolchain
        if: steps.sel.outputs.run == '1'
        run: |
          set -eu
          # kpm/Makefile builds with gcc. The DDK ships AOSP clang for kernel
          # work but not a cross gcc, so it is installed here rather than
          # switching the Makefile: the entry half is compiled against the
          # KernelPatch SDK headers, which is a gcc-shaped build.
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu git make file >/dev/null
          aarch64-linux-gnu-gcc --version | head -1

      - name: Clone the KernelPatch SDK
        if: steps.sel.outputs.run == '1'
        env:
          KP_REPO: ${{ github.event.inputs.kp_repo }}
          KP_REF: ${{ github.event.inputs.kp_ref }}
        run: |
          set -eu
          repo="${KP_REPO:-https://github.com/bmax121/KernelPatch}"
          if [ -n "${KP_REF:-}" ]; then
            git clone --depth 1 -b "$KP_REF" "$repo" /tmp/kp
          else
            git clone --depth 1 "$repo" /tmp/kp
          fi
          test -d /tmp/kp/kernel/include || {
            echo "::error::$repo is not a KernelPatch checkout"; exit 1; }
          echo "KernelPatch at $(git -C /tmp/kp rev-parse --short HEAD)"

      - name: Symbol survey
        id: survey
        if: steps.sel.outputs.run == '1'
        continue-on-error: true
        run: |
          set -o pipefail
          cd kpm
          out=/tmp/kpm-syms-${{ matrix.kmi }}.txt
          # -s matters: without it make echoes each recipe to stdout and the
          # compile command line lands IN the symbol list.
          make -s undefined \
            TARGET_COMPILE=aarch64-linux-gnu- \
            KP_DIR=/tmp/kp \
            KERNEL_DIR="$KDIR" \
            2>/tmp/kpm-compile-${{ matrix.kmi }}.log | tee "$out"

          # The engine object must be arm64. Worth checking explicitly: when this
          # once used the host compiler by accident, it surfaced as assembler
          # noise about register sizes and never said "wrong architecture".
          if [ -f nm_engine.o ]; then
            arch=$(file -b nm_engine.o); echo "nm_engine.o: $arch"
            case "$arch" in
              *aarch64*) ;;
              *) echo "::error::nm_engine.o is not aarch64 ($arch)"; exit 1 ;;
            esac
          fi

      - name: Build nomount.kpm
        id: kpmbuild
        if: steps.sel.outputs.run == '1'
        continue-on-error: true
        run: |
          set -o pipefail
          cd kpm
          make \
            TARGET_COMPILE=aarch64-linux-gnu- \
            KP_DIR=/tmp/kp \
            KERNEL_DIR="$KDIR" \
            2>&1 | tee -a /tmp/kpm-compile-${{ matrix.kmi }}.log | tail -30
          test -f nomount.kpm && cp nomount.kpm "$GITHUB_WORKSPACE/nomount-${{ matrix.kmi }}.kpm"

      # THE gate that separates "it linked" from "it could load". Anything
      # undefined that KernelPatch does not itself provide fails the load of the
      # WHOLE module with "unknown symbol", so this is not advisory.
      - name: Undefined symbols left in the .kpm
        if: steps.sel.outputs.run == '1'
        run: |
          set -eu
          kpm="$GITHUB_WORKSPACE/nomount-${{ matrix.kmi }}.kpm"
          if [ ! -f "$kpm" ]; then
            {
              echo "#### ${{ matrix.kmi }} — no .kpm built"
              echo '```'
              tail -30 /tmp/kpm-compile-${{ matrix.kmi }}.log 2>/dev/null || echo "(no log)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::no .kpm was produced"; exit 1
          fi

          out=/tmp/kpm-undef-${{ matrix.kmi }}.txt
          aarch64-linux-gnu-nm -u "$kpm" | awk '{print $2}' | sort -u > "$out"

          # What KernelPatch supplies to a module, per its own doc/en/module.md
          # and KP_EXPORT_SYMBOL in kernel/base/symbol.c.
          printf '%s\n' kallsyms_lookup_name printk symbol_lookup_name \
            | sort -u > /tmp/kp-provided.txt

          left=/tmp/kpm-unresolvable-${{ matrix.kmi }}.txt
          comm -23 "$out" /tmp/kp-provided.txt > "$left" || true
          {
            echo "#### ${{ matrix.kmi }} — $(stat -c%s "$kpm") bytes"
            echo '```'
            if [ -s "$out" ]; then cat "$out"; else echo '(nothing undefined)'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s "$left" ]; then
            {
              echo
              echo "**$(wc -l < "$left") of these are not provided by KernelPatch.**"
              echo "The loader rejects the whole module on the first one, so this"
              echo ".kpm would not load:"
              echo '```'
              cat "$left"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$(wc -l < "$left") symbols cannot be resolved at load"
            exit 1
          fi
          echo "All undefined symbols are ones KernelPatch provides." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.sel.outputs.run == '1' && always()
        with:
          name: kpm-${{ matrix.kmi }}
          path: |
            nomount-${{ matrix.kmi }}.kpm
            /tmp/kpm-syms-${{ matrix.kmi }}.txt
            /tmp/kpm-compile-${{ matrix.kmi }}.log
          if-no-files-found: warn
