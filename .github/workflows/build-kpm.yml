name: NoMount KPM - per-KMI build

on:
  push:
    branches: [KPM]
    paths:
      - 'kpm/**'
      - 'hookless/src/**'
      - '.github/workflows/build-kpm.yml'
      # The load gate's allow-list logic lives here, so a change to it has to
      # re-run the gate. Without this line an edit to the gate itself was the one
      # change that could never be tested by the gate.
      - '.github/kpm-allowed.py'
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated KMIs to build (blank = all)"
        required: false

concurrency:
  group: kpm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.ver }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ver: '5.4',  kref: 'android11-5.4'  }
          - { ver: '5.10', kref: 'android12-5.10' }
          - { ver: '5.15', kref: 'android13-5.15' }
          - { ver: '6.1',  kref: 'android14-6.1'  }
          - { ver: '6.6',  kref: 'android15-6.6'  }
    steps:
      - name: Should this KMI run?
        id: sel
        run: |
          only="${{ github.event.inputs.only }}"
          if [ -z "$only" ] || printf '%s' "$only" | tr ',' '\n' | grep -qx "${{ matrix.ver }}"; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"; echo "skipped ${{ matrix.ver }}"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.sel.outputs.run == '1'
        with:
          path: repo

      - name: Install toolchain
        if: steps.sel.outputs.run == '1'
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev build-essential rsync \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu >/dev/null
          clang --version | head -1
          aarch64-linux-gnu-gcc --version | head -1

      - name: Restore kernel clone
        id: kcache
        if: steps.sel.outputs.run == '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ksrc
          key: kpm-ksrc-${{ matrix.ver }}-${{ matrix.kref }}-v1

      - name: Clone kernel source on cache miss
        if: steps.sel.outputs.run == '1' && steps.kcache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --depth 1 -b "${{ matrix.kref }}" \
            https://android.googlesource.com/kernel/common ksrc
          echo "Kernel: $(head -3 ksrc/Makefile | tr '\n' ' ')"

      - name: Save kernel clone
        if: steps.sel.outputs.run == '1' && steps.kcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ksrc
          key: kpm-ksrc-${{ matrix.ver }}-${{ matrix.kref }}-v1

      - name: Checkout the KernelPatch SDK
        if: steps.sel.outputs.run == '1'
        run: |
          set -e
          git clone --filter=blob:none https://github.com/bmax121/KernelPatch.git kp
          git -C kp checkout -q 72a904c412754e25f54353c30f31f5c884ed0673
          test -d kp/kernel/include

      - name: Prepare kernel for external modules
        if: steps.sel.outputs.run == '1'
        run: |
          set -euxo pipefail
          cd ksrc
          M="ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS=-Wno-error"
          make $M defconfig
          ./scripts/config --enable CONFIG_KPROBES --enable CONFIG_MODULES
          make $M olddefconfig
          make $M -j"$(nproc)" modules_prepare

      - name: Build nomount.kpm
        if: steps.sel.outputs.run == '1'
        run: |
          set -euo pipefail
          make -C repo/kpm all \
            TARGET_COMPILE=aarch64-linux-gnu- \
            KP_DIR="$GITHUB_WORKSPACE/kp" \
            KERNEL_DIR="$GITHUB_WORKSPACE/ksrc" \
            KBUILD_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu-"
          ls -l repo/kpm/nomount.kpm

      - name: Every undefined symbol must be in the redirect table
        if: steps.sel.outputs.run == '1'
        run: |
          set -euo pipefail
          # The FINAL relocatable, not the individual objects.
          #
          # `make undefined` surveys nm_engine.o and nm_maps_spoof.o so gen-shim.py can
          # find what needs redirecting. That set is not the load-time set: it also
          # lists the module own symbols, which `ld -r` resolves inside the .kpm. Using
          # it here reported nm_kpm_sym (defined in nm_kpm_entry.c) and
          # vfs_map_meta_override (defined in nm_maps_spoof.c) as load failures on the
          # first run. `nm -u` over the linked .kpm is the exact set KernelPatch has to
          # place through kallsyms.
          aarch64-linux-gnu-nm -u repo/kpm/nomount.kpm > raw.txt
          awk "{ print \$NF }" raw.txt | sed "/^$/d" | sort -u > undef.txt
          # LOCAL and KP_PROVIDED are read from gen-shim.py rather than restated here.
          # The generator decides which symbols never enter the table - compiler
          # builtins it defines locally, and the two KernelPatch supplies - and a second
          # copy in this file is how the gate would start disagreeing with it.
          KP_DIR="$GITHUB_WORKSPACE/kp" python3 repo/.github/kpm-allowed.py > allowed.txt
          missing="$(comm -23 undef.txt allowed.txt || true)"
          if [ -n "$missing" ]; then
            echo "::error::${{ matrix.ver }}: symbols the module needs are absent from nm_kpm_table.h"
            echo "KernelPatch resolves every external reference through kallsyms at load"
            echo "time and rejects the whole module on the first one it cannot place, so"
            echo "each of these is a load failure on hardware, not a warning:"
            echo "$missing" | sed "s/^/    /"
            echo "Regenerate with kpm/gen-shim.py and commit the result."
            exit 1
          fi
          echo "all $(wc -l < undef.txt) undefined symbol(s) in the linked .kpm are covered"

      - name: Name the artifact by KMI
        if: steps.sel.outputs.run == '1'
        run: cp repo/kpm/nomount.kpm "nomount-${{ matrix.kref }}.kpm"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.sel.outputs.run == '1'
        with:
          name: nomount-kpm-${{ matrix.ver }}
          path: nomount-${{ matrix.kref }}.kpm
          retention-days: 7
