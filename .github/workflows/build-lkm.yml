name: NoMount LKM — out-of-tree build

# Builds the engine as a loadable module against all ten supported kernels.
#
# WHAT THIS ACTUALLY PROVES, and what it does not.
#
# An out-of-tree build here stops at `modules_prepare`, which does NOT produce
# Module.symvers -- so modpost cannot tell an exported symbol from a missing one
# and reports every external reference as undefined. The first run of this
# workflow duly "found" _printk, memcpy and init_net, all of which are exported,
# and on 5.15/6.1 it emitted a .ko anyway with "suppressed 90 unresolved symbol
# warnings". A .ko from that build is not evidence of anything.
#
# Building each kernel far enough for a real Module.symvers is ~30 minutes per
# version. The cheap and honest substitute: take modpost's undefined list and
# subtract the kernel's OWN EXPORT_SYMBOL* set, read from its source. What
# survives is the set of symbols the module truly cannot link against -- the
# work item. An empty result means the module links cleanly against a fully
# built tree, and that is what this job passes on.
#
# Read lkm/README.md for what this variant costs. It is not the recommended
# build and this workflow does not treat it as one.

on:
  push:
    branches: [LKM]
    paths:
      - 'lkm/**'
      - 'hookless/src/**'
      - '.github/workflows/build-lkm.yml'
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated versions (empty = all). e.g. 4.9,6.12"
        required: false
        default: ''

# NOTE: this workflow's entire run history was deleted once during an Actions
# cleanup. The file survived, but GitHub delists a workflow that has no runs,
# so it disappeared from the sidebar until the next push re-registered it.
# Deleting runs is not the same as deleting a workflow -- but with no runs
# left, the effect on the Actions page is indistinguishable.

permissions:
  contents: read

concurrency:
  group: LKM-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.ver }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The same ten the in-tree matrix covers, with the same refs and the same
        # toolchain per version. 4.9/4.14/4.19 need GCC: Ubuntu's clang cannot
        # compile them (asm-offsets dies on "register 'sp' unsuitable for global
        # register variables"), which is a compiler-vs-old-kernel mismatch and
        # says nothing about this module.
        include:
          - { ver: '4.9',  kref: 'deprecated/android-4.9-q',       tc: gcc   }
          - { ver: '4.14', kref: 'deprecated/android-4.14-stable', tc: gcc   }
          - { ver: '4.19', kref: 'deprecated/android-4.19-stable', tc: gcc   }
          - { ver: '5.4',  kref: 'android11-5.4',                  tc: clang }
          - { ver: '5.10', kref: 'android12-5.10',                 tc: clang }
          - { ver: '5.15', kref: 'android13-5.15',                 tc: clang }
          - { ver: '6.1',  kref: 'android14-6.1',                  tc: clang }
          - { ver: '6.6',  kref: 'android15-6.6',                  tc: clang }
          - { ver: '6.12', kref: 'android16-6.12',                 tc: clang }
          - { ver: '6.18', kref: 'linux-6.18.y',                   tc: clang }
    steps:
      - name: Should this version run?
        id: sel
        run: |
          only="${{ github.event.inputs.only }}"
          if [ -z "$only" ] || printf '%s' "$only" | tr ',' '\n' | grep -qx "${{ matrix.ver }}"; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"; echo "skipped ${{ matrix.ver }}"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.sel.outputs.run == '1'
        with:
          path: repo

      - name: Install toolchain
        if: steps.sel.outputs.run == '1'
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev build-essential rsync \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu >/dev/null
          if [ "${{ matrix.tc }}" = "clang" ]; then
            sudo apt-get install -y --no-install-recommends clang lld llvm >/dev/null
            clang --version | head -1
          else
            aarch64-linux-gnu-gcc --version | head -1
          fi

      - name: Restore kernel clone
        id: kcache
        if: steps.sel.outputs.run == '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ksrc
          key: lkm-ksrc-${{ matrix.ver }}-${{ matrix.kref }}-v2

      - name: Clone kernel source on cache miss
        if: steps.sel.outputs.run == '1' && steps.kcache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --depth 1 -b "${{ matrix.kref }}" \
            "$( [ "${{ matrix.ver }}" = "6.18" ] \
                && echo https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
                || echo https://android.googlesource.com/kernel/common )" ksrc
          echo "Kernel: $(head -3 ksrc/Makefile | tr '\n' ' ')"

      - name: Save kernel clone
        if: steps.sel.outputs.run == '1' && steps.kcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ksrc
          key: lkm-ksrc-${{ matrix.ver }}-${{ matrix.kref }}-v2

      - name: Prepare kernel for external modules
        if: steps.sel.outputs.run == '1'
        run: |
          set -euxo pipefail
          cd ksrc
          if [ "${{ matrix.tc }}" = "clang" ]; then
            M="ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS=-Wno-error"
          else
            M="ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS=-Wno-error"
          fi
          echo "MAKEOPTS=$M" >> "$GITHUB_ENV"
          make $M defconfig
          # KPROBES is what lkm/nm_oot.c's kallsyms bootstrap needs; MODULES is
          # what makes an out-of-tree build possible at all.
          ./scripts/config --enable CONFIG_KPROBES --enable CONFIG_MODULES
          make $M olddefconfig
          make $M -j"$(nproc)" modules_prepare

      - name: Build the module
        id: build
        if: steps.sel.outputs.run == '1'
        continue-on-error: true
        run: |
          set -o pipefail
          # KBUILD_MODPOST_WARN: without Module.symvers every external symbol is
          # "undefined", and on 6.6+ modpost makes that fatal. Warn instead, so
          # the run produces the symbol list that the next step judges.
          make -C ksrc $MAKEOPTS KBUILD_MODPOST_WARN=1 \
            M="$PWD/repo/lkm" modules 2>&1 | tee /tmp/lkm-${{ matrix.ver }}.log

      - name: Symbols the kernel does not export (the real gate)
        if: steps.sel.outputs.run == '1'
        run: |
          set -o pipefail
          log=/tmp/lkm-${{ matrix.ver }}.log
          out=/tmp/redirects-${{ matrix.ver }}.txt

          grep -oE '"[a-zA-Z_][a-zA-Z0-9_]*" \[' "$log" | tr -d '"[ ' | sort -u > /tmp/undef.txt || true
          grep -rhoE '\bEXPORT_SYMBOL(_GPL|_NS|_NS_GPL)?\(\s*[a-zA-Z_][a-zA-Z0-9_]*' ksrc \
            --include='*.c' --include='*.h' 2>/dev/null \
            | sed 's/.*(\s*//' | sort -u > /tmp/exported.txt || true
          comm -23 /tmp/undef.txt /tmp/exported.txt > "$out" || true

          # `|| true`, NOT `|| echo 0`. grep -c PRINTS 0 and EXITS 1 when it
          # matches nothing, so `|| echo 0` appends a second zero and the
          # variable becomes a two-line "0 0" -- which then fails the -eq test with
          # "integer expression expected" and reports a clean result as a
          # failure. That is exactly what the first ten-version run did.
          u=$(grep -c . /tmp/undef.txt || true)
          e=$(grep -c . /tmp/exported.txt || true)
          r=$(grep -c . "$out" || true)

          {
            echo "### ${{ matrix.ver }} (${{ matrix.tc }})"
            echo "- unresolved at modpost: **$u** (no Module.symvers at this stage — expected)"
            echo "- exported by this kernel: $e"
            echo "- **needing a kallsyms redirect: $r**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$r" -eq 0 ]; then
            echo "All $u unresolved symbols are exported by this kernel."
            echo "The module links cleanly against a fully built tree; no shim needed."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ every unresolved symbol is exported — links against a built tree, no shim needed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "These are NOT exported and need an NM_SYM() entry in lkm/nm_oot.h:"
            cat "$out"
            { echo '```'; cat "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.sel.outputs.run == '1'
        with:
          name: lkm-gate-log-${{ matrix.ver }}
          path: |
            /tmp/lkm-${{ matrix.ver }}.log
            /tmp/redirects-${{ matrix.ver }}.txt
          # The .ko this job produces is deliberately NOT uploaded. It comes from
          # a modules_prepare build under KBUILD_MODPOST_WARN, so its symbols were
          # never really resolved -- the header above says such a .ko is not
          # evidence of anything, and offering it for download invites someone to
          # try loading a module that cannot work. The loadable ones come from the
          # per-KMI jobs in build.yaml.
          retention-days: 7
          if-no-files-found: ignore
