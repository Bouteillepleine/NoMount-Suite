name: NoMount LKM — build a loadable module

# Produces a REAL nomount.ko you can download and insmod.
#
# HOW THIS DIFFERS FROM build-lkm.yml, and why both exist:
#
#   build-lkm.yml is a GATE. It stops at `modules_prepare`, which produces no
#   Module.symvers, so modpost cannot distinguish an exported symbol from a
#   missing one. It runs on every push across ten kernels in ~10 minutes and
#   answers one question: does the engine still compile as a module.
#
#   This workflow is a BUILD. It compiles the kernel far enough to generate a
#   real Module.symvers, so modpost resolves symbols for real and the .ko it
#   emits is properly linked. That costs ~40-60 minutes for ONE version, which
#   is why it is dispatch-only and takes a single version at a time.
#
# WHAT THE ARTIFACT IS LOADABLE ON -- read this before filing a bug.
#
# An out-of-tree module loads only on a kernel matching the one it was built
# against: vermagic must match exactly, and with CONFIG_MODVERSIONS the symbol
# CRCs must match too. A .ko built here against a stock GKI defconfig will NOT
# load on your OnePlus, because your kernel is not that kernel.
#
# To get a module that loads on YOUR device, point the inputs at the same source
# your kernel was built from -- kernel_repo, kernel_ref and defconfig. The job
# prints the resulting vermagic so you can compare it against the device:
#
#     cat /proc/version            # on the phone
#     modinfo nomount.ko           # what this built
#
# If those disagree insmod fails with "version magic ... should be ...", which is
# the module refusing to load into a kernel whose struct layouts it does not
# share. That refusal is correct behaviour, not a bug in this workflow.

on:
  workflow_dispatch:
    inputs:
      ver:
        description: "Kernel version to build against"
        required: true
        default: '6.6'
        type: choice
        options: ['4.9', '4.14', '4.19', '5.4', '5.10', '5.15', '6.1', '6.6', '6.12', '6.18']
      kernel_repo:
        description: "Kernel git URL (empty = the GKI common branch for that version)"
        required: false
        default: ''
      kernel_ref:
        description: "Branch/tag in that repo (empty = the default for the version)"
        required: false
        default: ''
      defconfig:
        description: "defconfig target, e.g. gki_defconfig. Empty = defconfig."
        required: false
        default: ''
      variant_ref:
        description: "Branch holding lkm/ (this file lives on main; the code does not)"
        required: false
        default: 'LKM'
      trim_to_kmi:
        description: "Trim exports to the GKI KMI, as a released GKI kernel does"
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

concurrency:
  group: lkm-release-${{ github.ref }}-${{ github.event.inputs.ver }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ github.event.inputs.ver }} (loadable)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      # This file has to sit on the default branch or GitHub will not offer it in
      # the Run-workflow menu at all, but lkm/ lives on its own branch -- so the
      # workflow checks that branch out explicitly rather than its own ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          ref: ${{ github.event.inputs.variant_ref || 'LKM' }}

      - name: Confirm the variant tree is actually here
        run: |
          set -eu
          test -f repo/lkm/Makefile || {
            echo "::error::no lkm/Makefile on ref '${{ github.event.inputs.variant_ref }}'"; exit 1; }
          test -f repo/hookless/src/nomount.c || {
            echo "::error::engine source missing; lkm/ includes it, so this cannot build"; exit 1; }

      - name: Resolve source and toolchain for this version
        id: cfg
        env:
          VER: ${{ github.event.inputs.ver }}
          IN_REPO: ${{ github.event.inputs.kernel_repo }}
          IN_REF: ${{ github.event.inputs.kernel_ref }}
          IN_DC: ${{ github.event.inputs.defconfig }}
        run: |
          set -eu
          case "$VER" in
            4.9)  kref='deprecated/android-4.9-q';       tc=gcc ;;
            4.14) kref='deprecated/android-4.14-stable'; tc=gcc ;;
            4.19) kref='deprecated/android-4.19-stable'; tc=gcc ;;
            5.4)  kref='android11-5.4';   tc=clang ;;
            5.10) kref='android12-5.10';  tc=clang ;;
            5.15) kref='android13-5.15';  tc=clang ;;
            6.1)  kref='android14-6.1';   tc=clang ;;
            6.6)  kref='android15-6.6';   tc=clang ;;
            6.12) kref='android16-6.12';  tc=clang ;;
            6.18) kref='linux-6.18.y';    tc=clang ;;
            *) echo "::error::unknown version $VER"; exit 1 ;;
          esac
          if [ "$VER" = '6.18' ]; then
            kurl='https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git'
          else
            kurl='https://android.googlesource.com/kernel/common'
          fi
          # Explicit inputs win: this is how you target your own device kernel.
          [ -n "$IN_REPO" ] && kurl="$IN_REPO"
          [ -n "$IN_REF" ]  && kref="$IN_REF"
          dc="$IN_DC"; [ -n "$dc" ] || dc=defconfig
          printf 'kurl=%s\nkref=%s\ntc=%s\ndc=%s\n' "$kurl" "$kref" "$tc" "$dc" >> "$GITHUB_OUTPUT"
          echo "building $VER from $kurl @ $kref with $tc, $dc"

      - name: Install toolchain
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev build-essential rsync ccache kmod \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu >/dev/null
          if [ '${{ steps.cfg.outputs.tc }}' = clang ]; then
            sudo apt-get install -y --no-install-recommends clang lld llvm >/dev/null
          fi

      - name: Clone kernel
        run: |
          set -eu
          git clone --depth 1 -b '${{ steps.cfg.outputs.kref }}' '${{ steps.cfg.outputs.kurl }}' ksrc
          echo "Kernel: $(make -s -C ksrc kernelversion 2>/dev/null || echo unknown)"

      - name: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: lkm-rel-ccache-${{ github.event.inputs.ver }}-${{ github.run_id }}
          restore-keys: lkm-rel-ccache-${{ github.event.inputs.ver }}-

      - name: Configure
        run: |
          set -eux
          cd ksrc
          if [ '${{ steps.cfg.outputs.tc }}' = clang ]; then
            M='ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS=-Wno-error'
          else
            M='ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS=-Wno-error'
          fi
          echo "MAKEOPTS=$M" >> "$GITHUB_ENV"
          make $M '${{ steps.cfg.outputs.dc }}'
          # KPROBES backs lkm/nm_oot.c's kallsyms bootstrap; MODULES is what makes
          # an out-of-tree build possible at all. Both are asserted after
          # olddefconfig rather than assumed, because a defconfig that silently
          # drops either produces a module that cannot work.
          ./scripts/config --enable CONFIG_KPROBES --enable CONFIG_MODULES
          make $M olddefconfig
          for opt in CONFIG_KPROBES CONFIG_MODULES; do
            grep -qx "$opt=y" .config || { echo "::error::$opt unset after olddefconfig"; exit 1; }
          done

          # KMI TRIMMING.
          #
          # A released GKI kernel exports only the symbols named in
          # android/abi_gki_aarch64*; everything else loses its export even
          # though the source EXPORT_SYMBOLs it. That is applied by Google's
          # Bazel build (trim_nonlisted_kmi), NOT by gki_defconfig -- so a plain
          # `make gki_defconfig` here would NOT reproduce it, and a module that
          # links against such a build tells you nothing about whether it would
          # load on a phone.
          #
          # Reproduced explicitly: concatenate every abi list into one whitelist
          # and turn trimming on. This is the build that answers "is this module
          # KMI-portable".
          if [ "${{ github.event.inputs.trim_to_kmi }}" = 'true' ]; then
            if ! ls android/abi_gki_aarch64* >/dev/null 2>&1; then
              echo "::error::no android/abi_gki_aarch64* lists here; no KMI to trim to"
              exit 1
            fi
            cat android/abi_gki_aarch64* \
              | grep -E '^[[:space:]]+[a-zA-Z_][a-zA-Z0-9_]*[[:space:]]*$' \
              | tr -d ' \t' | sort -u > android/nm_kmi_union
            echo "KMI whitelist: $(wc -l < android/nm_kmi_union) symbols"
            ./scripts/config --enable CONFIG_TRIM_UNUSED_KSYMS \
                             --set-str CONFIG_UNUSED_KSYMS_WHITELIST android/nm_kmi_union
            make $M olddefconfig
            grep -qx 'CONFIG_TRIM_UNUSED_KSYMS=y' .config || {
              echo "::error::trimming did not stick"; exit 1; }
            echo "TRIMMED=1" >> "$GITHUB_ENV"
          fi

      - name: Build kernel (this is what produces a real Module.symvers)
        run: |
          set -eu
          cd ksrc
          export PATH="/usr/lib/ccache:$PATH"
          # `vmlinux` alone, NOT `vmlinux modules`. What this job actually needs
          # is Module.symvers -- the kernel's export table, without which modpost
          # calls every external reference undefined. modpost produces that while
          # linking vmlinux. Adding `modules` also builds every module a GKI
          # defconfig enables, which is hundreds of objects this job never looks
          # at; the first version of this step did that and ran past 100 minutes.
          make $MAKEOPTS -j"$(nproc)" vmlinux 2>&1 | tail -40

          # Older kernels populate Module.symvers only once modpost has run over
          # the module set, so fall back rather than assuming. Still far cheaper
          # than doing it unconditionally.
          if [ ! -s Module.symvers ]; then
            echo "no Module.symvers from vmlinux alone; building modules for it"
            make $MAKEOPTS -j"$(nproc)" modules 2>&1 | tail -20
          fi
          test -s Module.symvers || { echo "::error::no Module.symvers after the build"; exit 1; }
          echo "Module.symvers: $(wc -l < Module.symvers) exported symbols"

      - name: Build nomount.ko against it
        run: |
          set -eu
          cd ksrc
          export PATH="/usr/lib/ccache:$PATH"
          # No KBUILD_MODPOST_WARN here, deliberately. With a real Module.symvers
          # an undefined symbol is a genuine failure and must stop the build; the
          # gate workflow suppresses that only because its symbol table is fake.
          make $MAKEOPTS -j"$(nproc)" M="$GITHUB_WORKSPACE/repo/lkm" modules
          ko="$GITHUB_WORKSPACE/repo/lkm/nomount.ko"
          test -f "$ko" || { echo "::error::no nomount.ko was produced"; exit 1; }
          cp "$ko" "$GITHUB_WORKSPACE/nomount.ko"

      - name: Verify the artifact
        run: |
          set -eu
          ko="$GITHUB_WORKSPACE/nomount.ko"
          {
            echo "## nomount.ko — ${{ github.event.inputs.ver }}"
            echo
            echo '```'
            echo "size: $(stat -c%s "$ko") bytes"
            modinfo "$ko" 2>/dev/null | grep -E '^(vermagic|name|description|license|nomount_variant)' || true
            echo '```'
            echo
            echo "**Loadable on:** a kernel whose vermagic matches the line above."
            echo "Compare with \`cat /proc/version\` on the device before insmod."
            echo
            if [ "${TRIMMED:-0}" = 1 ]; then
              echo "Built against a **KMI-trimmed** kernel: exports were restricted to"
              echo "the union of \`android/abi_gki_aarch64*\`, the way a released GKI"
              echo "kernel is. Linking under those conditions is what shows the six"
              echo "symbols GKI trims are genuinely handled by \`lkm/nm_oot_tramp.c\`."
            else
              echo "Built against an **untrimmed** kernel, so every EXPORT_SYMBOL in the"
              echo "source was available. That is easier than a real GKI kernel -- rerun"
              echo "with \`trim_to_kmi: true\` to test the case that matters."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # NOT an error check. Every valid .ko carries undefined symbols -- that
          # is how module linking works: they are resolved against the kernel at
          # insmod, not at build time. modpost is what decides whether they can
          # actually be satisfied, and with a real Module.symvers it has already
          # failed this job above if any could not be. Printed for information.
          n=$(aarch64-linux-gnu-nm -u "$ko" | wc -l)
          echo "external symbols this module expects the kernel to provide: $n" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$ko" | tee -a "$GITHUB_STEP_SUMMARY"

      # always(): if the build got as far as producing a .ko, that .ko is worth
      # having even when a later reporting step tripped over something.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nomount-lkm-${{ github.event.inputs.ver }}
          path: nomount.ko
          if-no-files-found: warn
