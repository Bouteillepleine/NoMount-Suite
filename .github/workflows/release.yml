name: NoMount Suite — release

# Publishes a GitHub release when a v* tag is pushed.
#
# WHY THIS IS A SEPARATE WORKFLOW
#
# The release used to be a job inside build.yaml, gated on `startsWith(github.ref,
# 'refs/tags/v')`. That worked until build.yaml gained a `paths-ignore` filter to
# stop documentation commits triggering builds -- and GitHub applies path filters
# to TAG pushes as well. A `v*` tag landing on a commit that happened to touch
# only documentation would have been filtered out, the workflow would never have
# fired, and no release would have been published. Silently.
#
# Splitting it removes that interaction entirely: this file has no path filter,
# so a tag always builds and always publishes.
#
# It does not duplicate the pipeline. build.yaml is called as a reusable
# workflow, so the zip is produced by exactly the same jobs as every other build,
# and the artifact it uploads is visible to the publish job below because a
# called workflow shares the caller's run.

on:
  push:
    tags: ['v*']
  # Manual re-publish, for the case where a release needs rebuilding from an
  # existing tag without moving it.
  workflow_dispatch:
    inputs:
      tag:
        description: "v* tag to publish (or to validate, with dry_run)"
        required: true
      dry_run:
        description: "Build and validate, but publish nothing"
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same build every push gets: tests, clippy, shellcheck, the binaries, the
  # zip. Nothing release-specific happens here, which is the point -- what gets
  # published is what CI already builds.
  build:
    uses: ./.github/workflows/build.yaml

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Elevated for THIS job only -- the workflow default stays contents: read.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nomount-release-zip
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          # Empty on a tag push, so a real release is never a dry run by accident.
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          zip=$(ls dist/00_NoMount-Module-*.zip | head -1)
          test -s "$zip"
          # The zip is named from Cargo.toml; the release is named from the tag.
          # Nothing asserted the two agreed, so tagging v1.4.0 on a tree whose
          # Cargo.toml still said 1.3.88 published a release titled v1.4.0 whose
          # asset was v1.3.88 -- and since managers key updates on versionCode,
          # that "new release" is invisible as an update to every device.
          zipver="${zip##*00_NoMount-Module-}"
          zipver="${zipver%.zip}"
          zipver="${zipver%-debug}"
          if [ "$zipver" != "$TAG" ]; then
            echo "FATAL: tag $TAG does not match the packaged version $zipver." >&2
            echo "       Bump Cargo.toml and re-tag; do not publish a mismatch." >&2
            exit 1
          fi
          # DRY RUN stops here: everything above has already run for real -- the
          # build, the artifact download across the workflow_call boundary, and
          # the tag-vs-zip version check -- which is the whole of what could go
          # wrong. Only the irreversible step is skipped.
          if [ "${DRY_RUN:-}" = 'true' ]; then
            echo "DRY RUN — nothing published."
            echo "  tag        : $TAG"
            echo "  asset      : $zip ($(stat -c %s "$zip") bytes)"
            echo "  version    : matches the tag"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "  NOTE: a release for $TAG already exists; a real run would fail here."
            else
              echo "  release    : does not exist yet, would be created"
            fi
            exit 0
          fi

          echo "publishing $TAG <- $zip ($(stat -c %s "$zip") bytes)"
          # The tag is authoritative for the name; the notes point at the commit
          # log rather than restating it, so this never goes stale.
          # The engine ships in the KERNEL and the Suite ships as a zip, so an
          # in-manager update moves one and not the other -- and this release page
          # is where that update offer lands. Saying it here is what keeps "the
          # new Suite did not enable X" reading as a kernel they have not flashed
          # yet, rather than as a bug in the Suite.
          #
          # --notes-file sets the same body --notes does, which gh PREPENDS to the
          # generated notes; a file avoids quoting a multi-line note through the
          # workflow, the shell and gh all at once.
          cat > /tmp/notes.md <<'NOTES'
          > **The Suite and the Prism engine update separately.**
          >
          > The engine is compiled into the kernel (`CONFIG_NOMOUNT=y`); the Suite is this
          > module. Installing this update does **not** move the engine — for that you flash
          > a kernel built from the matching `hookless/` source.
          >
          > The Suite is built to run on an older engine, so this is normal rather than a
          > fault. Anything that needs a newer one is **named** by `nomount check` and by the
          > WebUI instead of silently doing nothing, so you can see what a kernel update would
          > buy you. The footer shows both numbers — `Suite vX · engine vY`.
          NOTES
          sed -i 's/^          //' /tmp/notes.md

          gh release create "$TAG" "$zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NoMount Suite $TAG" \
            --notes-file /tmp/notes.md \
            --generate-notes

      # update.json is written HERE and nowhere else, which is what makes the
      # in-manager update offer track RELEASES rather than the prerelease branch:
      # this job runs only on a v* tag, and tags are only ever cut for releases.
      # A push to `prerelease` cannot move it.
      #
      # Generated, not hand-maintained, because the one field that must never
      # drift is versionCode -- managers key the update offer on it, so a stale
      # file either hides a real release or offers one whose asset 404s. It is
      # read out of the module.prop INSIDE the published zip: the same byte the
      # device compares against, not a second source that can disagree with it.
      - name: Point update.json at this release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          zip=$(ls dist/00_NoMount-Module-*.zip | head -1)
          vcode=$(unzip -p "$zip" module.prop | sed -n 's/^versionCode=//p' | head -1)
          case "$vcode" in ''|*[!0-9]*)
            echo "FATAL: versionCode '$vcode' is not a number" >&2; exit 1;; esac

          base="https://github.com/${GITHUB_REPOSITORY}"
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main"
          printf '%s\n' \
            '{' \
            "  \"version\": \"$TAG\"," \
            "  \"versionCode\": $vcode," \
            "  \"zipUrl\": \"$base/releases/download/$TAG/$(basename "$zip")\"," \
            "  \"changelog\": \"$raw/CHANGELOG.md\"" \
            '}' > /tmp/update.json
          cat /tmp/update.json

          # Onto main, not onto the tag: the tag may sit behind main by the time
          # this runs, and update.json has to land on the branch module.prop
          # actually points at.
          git clone --depth 1 --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/mainwt
          cp /tmp/update.json /tmp/mainwt/update.json
          cd /tmp/mainwt
          if git diff --quiet -- update.json; then
            echo "update.json already current -- nothing to commit."
            exit 0
          fi
          git -c user.name=Bouteillepleine -c user.email=steve0007.xda@gmail.com \
            commit -q -m "update.json -> $TAG" -- update.json
          # The release is already live at this point; failing to move the
          # pointer must be LOUD, but it is not the release failing.
          git push origin main || {
            echo "::error::release $TAG published, but update.json could not be pushed to main"
            exit 1
          }
          echo "update.json now points at $TAG"
