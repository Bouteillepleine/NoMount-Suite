name: NoMount Suite - release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: "v* tag to publish; created at this commit if it does not exist"
        required: true
        type: string
      dry_run:
        description: "Build and validate, but publish nothing"
        required: false
        default: 'false'
        type: string
      replace_assets:
        description: "Replace the zips of an already published version"
        required: false
        default: 'false'
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "v* tag to publish (or to validate, with dry_run)"
        required: true
      dry_run:
        description: "Build and validate, but publish nothing"
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      replace_assets:
        description: "Replace the zips of an already published version (it is immutable otherwise)"
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yaml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nomount-release-zip
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPLACE_ASSETS: ${{ inputs.replace_assets }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN:-}" != 'true' ] \
             && [ "$GITHUB_REF" != "refs/heads/main" ] \
             && [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "FATAL: a real publish runs from main or from $TAG, not $GITHUB_REF." >&2
            echo "       Re-run with the tag selected as the ref, or with dry_run." >&2
            exit 1
          fi
          zip=$(ls dist/00_NoMount-Module-*.zip | head -1)
          test -s "$zip"
          # `-` sorts before `.`, so `ls | head -1` picks the -debug zip over the release
          # one when both are present -- and the `%-debug` strip below then made the
          # version gate accept it. Refuse outright instead: a debug build must never be
          # what gets published.
          case "$zip" in
            *-debug.zip)
              echo "FATAL: $zip is a debug build; refusing to publish it." >&2
              echo "       dist/ should hold only release zips at this point." >&2
              exit 1 ;;
          esac
          lkmzip=$(compgen -G 'dist/01_NoMount-Module-LKM-*.zip' | head -1 || true)
          case "$lkmzip" in
            ''|*-debug.zip)
              echo "FATAL: no 01_ release zip in dist/ - a release ships both flavors, and" >&2
              echo "       update-lkm.json must name one. Nothing was published." >&2
              exit 1 ;;
          esac
          test -s "$lkmzip"
          zipver="${zip##*00_NoMount-Module-}"
          zipver="${zipver%.zip}"
          if [ "$zipver" != "$TAG" ]; then
            echo "FATAL: tag $TAG does not match the packaged version $zipver." >&2
            echo "       Bump Cargo.toml and re-tag; do not publish a mismatch." >&2
            exit 1
          fi
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha' 2>/dev/null || true)
          printf '%s' "$tag_sha" | grep -qE '^[0-9a-f]{40}$' || tag_sha=""
          if [ -z "$tag_sha" ]; then
            echo "tag $TAG does not exist yet - it will be created at $GITHUB_SHA"
          elif [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "FATAL: $TAG points at $tag_sha but this build is $GITHUB_SHA." >&2
            echo "       A published version is immutable. Bump Cargo.toml to release this commit." >&2
            exit 1
          fi

          if [ "${DRY_RUN:-}" = 'true' ]; then
            echo "DRY RUN - nothing published."
            echo "  tag        : $TAG"
            echo "  asset      : $zip ($(stat -c %s "$zip") bytes)"
            echo "  version    : matches the tag"
            if [ -z "$tag_sha" ]; then
              echo "  tag state  : would be created at $GITHUB_SHA"
            else
              echo "  tag state  : already at $GITHUB_SHA"
            fi
            case "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo none)" in
              true)  echo "  release    : a draft; a real run would fill it and publish it" ;;
              false) echo "  release    : already published; a real run keeps it if the zips match, else refuses" ;;
              *)     echo "  release    : does not exist yet, would be created" ;;
            esac
            exit 0
          fi

          echo "publishing $TAG <- $zip ($(stat -c %s "$zip") bytes)"
          # Release notes = this tag's CHANGELOG section, nothing else.
          head=$(awk -v tag="$TAG" 'BEGIN{gsub(/\./,"\\.",tag)}
            $0 ~ "^## "tag"($| )" {sub(/^## /,""); print; exit}' CHANGELOG.md)
          body=$(awk -v tag="$TAG" 'BEGIN{gsub(/\./,"\\.",tag)}
            $0 ~ "^## "tag"($| )" {hit=1; next}
            hit && /^## / {exit}
            hit && NF == 0 && !started {next}
            hit {started = 1; print}' CHANGELOG.md)
          # Fatal, not a warning. tag.yml makes this exact requirement fatal before it ever
          # calls here, but release.yml is also triggerable directly by pushing a v* tag,
          # and on that path an empty body only warned -- so a tag pushed by hand published
          # a release with no notes at all, past the one gate that exists to stop it. A
          # published version is immutable, so the only remedy is another version bump.
          if [ -z "$body" ] && [ "${DRY_RUN:-}" != 'true' ]; then
            echo "::error::CHANGELOG.md has no section for $TAG - refusing to publish a release with no notes"
            exit 1
          fi
          if [ -z "$body" ]; then
            echo "::warning::CHANGELOG.md has no section for $TAG - the release notes will be empty"
          fi
          {
            if [ -n "$head" ]; then printf '**%s**\n\n' "$head"; fi
            if [ -n "$body" ]; then printf '%s\n' "$body"; fi
            printf '\n> `00_NoMount-Module` for a kernel with NoMount built in, `01_NoMount-Module-LKM` for one without.\n'
          } > /tmp/notes.md

          # A hash published OUTSIDE the zip. nomount.sha256sums travels inside it,
          # and a repack can regenerate it, so it proves the download is whole and
          # says nothing about where it came from. This does.
          ( cd dist && sha256sum *.zip ) > /tmp/SHA256SUMS
          cat /tmp/SHA256SUMS
          {
            printf '\n```\n'
            cat /tmp/SHA256SUMS
            printf '```\n'
          } >> /tmp/notes.md

          # A draft has no tag yet, so its asset URLs 404 for every device; a published
          # version is immutable, so its assets are only re-sent when that is asked for.
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft \
                    -q 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo none)
          case "$state" in
            none)
              gh release create "$TAG" "$zip" "$lkmzip" /tmp/SHA256SUMS \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "NoMount Suite $TAG" \
                --notes-file /tmp/notes.md
              ;;
            draft)
              echo "release $TAG is a draft: filling it and publishing it at $GITHUB_SHA"
              gh release upload "$TAG" "$zip" "$lkmzip" /tmp/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/notes.md \
                --draft=false --target "$GITHUB_SHA"
              ;;
            published)
              _pre="$(mktemp -d)"
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -D "$_pre" --pattern '*.zip' --clobber 2>/dev/null || true
              _same=1
              for _f in "$zip" "$lkmzip"; do
                cmp -s "$_f" "$_pre/$(basename "$_f")" || _same=0
              done
              rm -rf "$_pre"
              if [ "$_same" = 1 ]; then
                # "Re-run failed jobs" after the update.json push failed: the same build is
                # live. Its notes are kept, hand trims included, and so is changelog-latest.
                echo "release $TAG is already published with these exact zips - leaving it as it is"
                gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > /tmp/notes.md
                state=kept
              elif [ "${REPLACE_ASSETS:-}" = 'true' ]; then
                echo "::warning::$TAG is published with different zips; replacing them because replace_assets is set"
                gh release upload "$TAG" "$zip" "$lkmzip" /tmp/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
                gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/notes.md
              else
                echo "FATAL: $TAG is already published with different zips, and a published version is immutable." >&2
                echo "       To retry only the update.json step, use 'Re-run failed jobs' on the run that built it." >&2
                echo "       To replace its assets anyway, dispatch with replace_assets=true." >&2
                exit 1
              fi
              ;;
          esac
          echo "$state" > /tmp/publish-state

      # The notes quote the hashes, SHA256SUMS carries them, and the zips are
      # the thing itself. Within one run they are built from the same dist/, but
      # nothing re-read them afterwards -- so an interleaved manual upload could
      # leave all three disagreeing and the run still green. Read them back.
      - name: Verify the published assets match the notes
        if: ${{ inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          v="$(mktemp -d)"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -D "$v" --clobber
          ( cd "$v" && sha256sum -c SHA256SUMS )
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$v/notes.md"
          bad=0
          # A kept release shows its live notes, which may have been trimmed by hand.
          lvl=error
          [ "$(cat /tmp/publish-state 2>/dev/null)" = kept ] && lvl=warning
          while read -r d n; do
            [ -n "${d:-}" ] || continue
            grep -qF "$d  $n" "$v/notes.md" || { echo "::$lvl::release notes do not carry the published hash of $n ($d)"; bad=1; }
          done < "$v/SHA256SUMS"
          [ "$bad" = 0 ] || [ "$lvl" = warning ] || exit 1
          echo "published assets, SHA256SUMS and notes all agree"
          rm -rf "$v"

      - name: Point update.json at this release
        if: ${{ inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          zip=$(ls dist/00_NoMount-Module-*.zip | head -1)
          vcode=$(unzip -p "$zip" module.prop | sed -n 's/^versionCode=//p' | head -1)
          case "$vcode" in ''|*[!0-9]*)
            echo "FATAL: versionCode '$vcode' is not a number" >&2; exit 1;; esac

          base="https://github.com/${GITHUB_REPOSITORY}"
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main"
          printf '%s\n' \
            '{' \
            "  \"version\": \"$TAG\"," \
            "  \"versionCode\": $vcode," \
            "  \"zipUrl\": \"$base/releases/download/$TAG/$(basename "$zip")\"," \
            "  \"changelog\": \"$raw/docs/changelog-latest.md\"" \
            '}' > /tmp/update.json
          cat /tmp/update.json

          # One endpoint per flavor. The LKM zip carries updateJson=.../update-lkm.json
          # (stamped by package.sh), so without this file its users are offered nothing --
          # and with the two sharing one endpoint they were offered the LITE zip, which has
          # no engine module in it at all.
          lkmzip=$(compgen -G 'dist/01_NoMount-Module-LKM-*.zip' | head -1 || true)
          if [ -z "$lkmzip" ]; then
            echo "FATAL: no 01_ zip in dist/, but update-lkm.json must name one" >&2; exit 1
          fi
          lkmcode=$(unzip -p "$lkmzip" module.prop | sed -n 's/^versionCode=//p' | head -1)
          if [ "$lkmcode" != "$vcode" ]; then
            echo "FATAL: 00_ is versionCode $vcode but 01_ is $lkmcode" >&2; exit 1
          fi
          unzip -p "$lkmzip" module.prop | grep -q '^updateJson=.*/update-lkm\.json$' || {
            echo "FATAL: the 01_ zip does not point at update-lkm.json, so it would be" >&2
            echo "       updated onto the lite build" >&2; exit 1; }
          printf '%s\n' \
            '{' \
            "  \"version\": \"$TAG\"," \
            "  \"versionCode\": $vcode," \
            "  \"zipUrl\": \"$base/releases/download/$TAG/$(basename "$lkmzip")\"," \
            "  \"changelog\": \"$raw/docs/changelog-latest.md\"" \
            '}' > /tmp/update-lkm.json
          cat /tmp/update-lkm.json

          # Asked as a device asks: no token. A draft, a private repo or a missing asset all
          # answer 404 here, and pointing every manager at that is a green run nobody can use.
          for _z in "$zip" "$lkmzip"; do
            _u="$base/releases/download/$TAG/$(basename "$_z")"
            if ! curl -fsSIL --retry 3 --retry-delay 10 -o /dev/null "$_u"; then
              echo "::error::$_u is not downloadable without a token - update.json left where it is"
              exit 1
            fi
          done

          git clone --depth 1 --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/mainwt
          live=$(sed -n 's/.*"versionCode"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' /tmp/mainwt/update.json 2>/dev/null | head -1 || true)
          if [ -n "$live" ] && [ "$vcode" -lt "$live" ]; then
            echo "::warning::main/update.json already offers versionCode $live, above $TAG's $vcode - left pointing where it is"
            exit 0
          fi
          cp /tmp/update.json /tmp/mainwt/update.json
          cp /tmp/update-lkm.json /tmp/mainwt/update-lkm.json
          # The manager fetches `changelog` and shows it verbatim, so it gets THIS
          # version's section only -- the same /tmp/notes.md the release notes use,
          # not the whole history of CHANGELOG.md.
          mkdir -p /tmp/mainwt/docs
          cp /tmp/notes.md /tmp/mainwt/docs/changelog-latest.md
          cd /tmp/mainwt
          git add update.json update-lkm.json docs/changelog-latest.md
          if git diff --cached --quiet -- update.json update-lkm.json docs/changelog-latest.md; then
            echo "update.json already current -- nothing to commit."
            exit 0
          fi
          git -c user.name=Bouteillepleine -c user.email=76688492+Bouteillepleine@users.noreply.github.com \
            commit -q -m "update.json -> $TAG"
          _pushed=0
          for _try in 1 2 3 4 5; do
              if git push origin main; then _pushed=1; break; fi
              echo "push rejected (attempt $_try) - main moved; rebasing onto it and retrying"
              git fetch --depth 50 origin main || true
              if ! git rebase FETCH_HEAD; then
                  git rebase --abort || true
                  echo "::error::update.json could not be rebased onto main - resolve by hand"
                  break
              fi
              sleep $(( _try * 3 ))
          done
          if [ "$_pushed" != 1 ]; then
              echo "::error::release $TAG published, but update.json could not be pushed to main"
              echo "::error::devices keep being offered the previous release until this lands"
              exit 1
          fi
          echo "update.json now points at $TAG"
