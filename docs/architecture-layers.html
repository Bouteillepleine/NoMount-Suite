<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoMount Suite · Layer stack</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · nomount-suite v1.3.176</p>
    <h1>NoMount Suite · Where the injection actually happens</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nomount-layers-title nomount-layers-desc">
      <title id="nomount-layers-title">NoMount Suite · Kernel engine to WebUI</title>
      <desc id="nomount-layers-desc">Layer stack showing the NoMount Suite from the Prism kernel engine at the bottom, up through the netlink control plane, the Rust metamodule and CLI, the boot scripts, and the WebUI, with the kernel engine marked as the only layer that serves files.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Direction column (left margin) -->
      <text x="60" y="68" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">USERSPACE</text>
      <line x1="80" y1="80" x2="80" y2="400" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <polygon points="76,80 84,80 80,72" fill="#4f5d75"/>
      <text x="60" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">KERNEL VFS</text>

      <!-- Stack container hairlines (top + bottom edges) -->
      <line x1="120" y1="80" x2="960" y2="80" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="120" y1="400" x2="960" y2="400" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- L5 - WebUI (top layer, near-white fill) -->
      <rect x="120" y="80" width="840" height="64" fill="#ffffff"/>
      <line x1="120" y1="144" x2="960" y2="144" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="140" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L5</text>
      <text x="260" y="118" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">WebUI</text>
      <text x="940" y="118" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">module/webroot · status, rules, check</text>

      <!-- L4 - Boot scripts -->
      <rect x="120" y="144" width="840" height="64" fill="#f5f5f5"/>
      <line x1="120" y1="208" x2="960" y2="208" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="140" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L4</text>
      <text x="260" y="182" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Boot scripts</text>
      <text x="940" y="182" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">metamount · post-mount · service · uidwatch</text>

      <!-- L3 - Metamodule + CLI -->
      <rect x="120" y="208" width="840" height="64" fill="#f5f5f5"/>
      <line x1="120" y1="272" x2="960" y2="272" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="140" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L3</text>
      <text x="260" y="246" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Metamodule + CLI</text>
      <text x="940" y="246" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">src/ rust · mount, reload, absorb, check</text>

      <!-- L2 - Netlink control plane -->
      <rect x="120" y="272" width="840" height="64" fill="#ececec"/>
      <text x="140" y="308" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
      <text x="260" y="310" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Netlink control plane</text>
      <text x="940" y="310" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">nm · no libc · ~4 KB · version-locked</text>

      <!-- L1 - Prism kernel engine (FOCAL, coral tint + coral stroke) -->
      <rect x="120" y="336" width="840" height="64" fill="rgba(235,108,54,0.08)"/>
      <rect x="120" y="336" width="840" height="64" fill="none" stroke="#eb6c36" stroke-width="1"/>
      <text x="140" y="372" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">L1</text>
      <text x="260" y="374" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Prism kernel engine</text>
      <text x="940" y="374" fill="#eb6c36" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">CONFIG_NOMOUNT=y · per-inode ops hijack</text>

      <!-- Caption -->
      <text x="120" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ONE EXCEPTION</text>
      <text x="216" y="452" fill="#4f5d75" font-size="12" font-family="'Instrument Serif', serif" font-style="italic">Every layer above L1 only programs the engine - none of them serves a file. On a stock kernel the</text>
      <text x="216" y="468" fill="#4f5d75" font-size="12" font-family="'Instrument Serif', serif" font-style="italic">Suite installs, reports, and injects nothing; the two halves are flashed and versioned as a pair.</text>
    </svg>
  </div>
</body>
</html>
